 region surrounding Brussels, the Belgian capital is largely French-speaking, creating a lasting linguistic tension. Famous medieval Flemish painters include Jan van Eyck and Pieter Bruegel. Name these people.", "a": "Flemish (people)", "c": ["Dutch-speaking population of northern Belgium.", "Their region is called Flanders.", "Brussels — the capital — is geographically in Flanders but mostly French-speaking.", "Jan van Eyck and Pieter Bruegel were famous artists from this group."]}, {"q": "This southern Italian city on the Bay of Naples is overlooked by the volcano that buried ancient Pompeii in 79 AD. It is widely considered the birthplace of pizza, and its historic center — riddled with underground Greek-Roman tunnels — is a UNESCO World Heritage Site. Name it.", "a": "Naples", "c": ["Sits on the Bay of Naples, near the volcano that buried Pompeii in 79 AD.", "Widely considered the birthplace of pizza.", "Its historic center is a UNESCO World Heritage Site.", "Underground Greek-Roman tunnels run beneath the city."]}, {"q": "This European river passes through or borders more countries than any other river on Earth — ten in total. Starting in Germany's Black Forest, it flows past Vienna, Bratislava, Budapest, and Belgrade before forming a large delta at the Black Sea. A famous waltz names its color. Name it.", "a": "Danube River", "c": ["Flows through or borders 10 countries — world record for rivers.", "Starts in Germany's Black Forest.", "Capitals: Vienna, Bratislava, Budapest, Belgrade.", "Strauss's famous waltz names it; empties into the Black Sea."]}, {"q": "This Italian island — the Mediterranean's largest — is home to Europe's tallest active volcano on its eastern flank, and was successively ruled by Greeks, Romans, Arabs, Normans, and Spanish. The narrow Strait of Messina separates it from the Italian boot. Name it.", "a": "Sicily", "c": ["Mediterranean's largest island.", "Mount Etna — Europe's tallest active volcano — is on its eastern flank.", "Greeks, Romans, Arabs, Normans, and Spanish ruled it in succession.", "Separated from mainland Italy by the Strait of Messina."]}, {"q": "This peninsula — westernmost in mainland Europe — is shared by Spain and Portugal. Its mountain border with France is the Pyrenees; its southern shore is separated from Africa by a strait barely 14 km wide. Nearly 800 years of Moorish Islamic rule left a lasting imprint on its languages and architecture. Name it.", "a": "Iberian Peninsula", "c": ["Westernmost peninsula of mainland Europe.", "Spain and Portugal share it.", "The Pyrenees border France; the Strait of Gibraltar separates it from Africa by 14 km.", "800 years of Moorish Islamic rule shaped its culture."]}, {"q": "This body of water bordered by Turkey, Bulgaria, Romania, Ukraine, Russia, and Georgia became geopolitically critical in 2014 when Russia seized a peninsula on its northern shore. Its deep waters are largely anoxic — devoid of oxygen below about 150 meters. Name it.", "a": "Black Sea", "c": ["Bordered by Turkey, Bulgaria, Romania, Ukraine, Russia, and Georgia.", "Russia seized Crimea — on its northern shore — in 2014.", "Deep waters below ~150 m are anoxic (almost no oxygen).", "Russia's naval fleet based here must use the Bosporus to reach the Mediterranean."]}, {"q": "This volcanic Aeolian island north of Sicily has erupted nearly continuously for 2,000+ years. Sailors in antiquity used its nighttime glow as a navigation aid; hence its nickname 'Lighthouse of the Mediterranean.' Name it.", "a": "Stromboli", "c": ["Volcanic island in the Aeolian Islands, north of Sicily.", "Erupting nearly continuously for 2,000+ years.", "Nickname: 'Lighthouse of the Mediterranean.'", "Ancient sailors used its glow for nighttime navigation."]}, {"q": "The Dutch-speaking population of northern Belgium are known by this name; their region is Flanders. Famous Flemish painters include Jan van Eyck and Pieter Bruegel. The Belgian capital, Brussels, sits geographically within Flanders but is predominantly French-speaking, a source of ongoing political tension. Name these people.", "a": "Flemish (people)", "c": ["Dutch-speaking population of northern Belgium — their region is Flanders.", "Famous artists: Jan van Eyck and Pieter Bruegel the Elder.", "Brussels is geographically in Flanders but predominantly French-speaking.", "Linguistic tension between Flemish and French-speaking (Walloon) Belgians is ongoing."]}, {"q": "This southern Italian city on the Bay of Naples is famous as the birthplace of pizza and is watched over by the volcano that buried Pompeii in 79 AD. Its historic center — laced with underground Greek-Roman tunnels — is a UNESCO World Heritage Site. Name it.", "a": "Naples", "c": ["On the Bay of Naples, overseen by Vesuvius — which buried Pompeii in 79 AD.", "Birthplace of pizza.", "Historic center is a UNESCO World Heritage Site.", "Underground Greek-Roman tunnels run beneath its streets."]}, {"q": "This Norwegian capital's medieval fortress — built around 1299 — has served as a royal residence, military stronghold, and prison across the centuries. Norway's extensive fjord-carved coastline is Europe's longest. Name this fortress and the capital where it stands.", "a": "Akershus Fortress, Oslo", "c": ["Built around 1299 on the waterfront of Norway's capital.", "Served as a royal residence, military stronghold, and prison.", "Norway's fjord-carved coastline is Europe's longest.", "The capital is Oslo."]}, {"q": "This travel zone, named after a 1985 agreement in a small Luxembourg town, comprises 29 European countries with no internal passport controls. It includes non-EU members like Norway and Switzerland. Name this area.", "a": "Schengen Area", "c": ["Named after a small Luxembourg town where the 1985 agreement was signed.", "29 European countries; no internal passport controls.", "Includes non-EU members like Norway and Switzerland.", "A single visa covers travel across all member states."]}, {"q": "This Louisiana city, birthplace of jazz and famous for its Cajun and Creole cuisine, hosts the United States' largest pre-Lenten carnival each year. It sits largely below sea level between the Mississippi River and Lake Pontchartrain. Its most famous neighborhood is the French Quarter. Name it.", "a": "New Orleans", "c": ["Birthplace of jazz, in Louisiana.", "Famous for Cajun/Creole cuisine: gumbo, crawfish, jambalaya.", "Hosts the US's largest Mardi Gras (pre-Lenten) carnival.", "Sits below sea level; the French Quarter is its most famous area."]}, {"q": "This island, the world's fifth-largest, is part of Canada's territory of Nunavut. Mostly above the Arctic Circle, it is home to Iqaluit, the territorial capital, and was named after English navigator William Baffin. It has been inhabited by Inuit peoples for thousands of years. Name it.", "a": "Baffin Island", "c": ["World's fifth-largest island, in Canada's Nunavut territory.", "Mostly above the Arctic Circle.", "Iqaluit, Nunavut's capital, sits on its southeastern coast.", "Named after English navigator William Baffin (1616)."]}, {"q": "The San Andreas Fault — a transform plate boundary in this US state — moves Los Angeles about 46 mm closer to San Francisco every year. The 1906 earthquake that devastated San Francisco resulted from this plate motion. Name this state.", "a": "California", "c": ["The San Andreas Fault runs through this US state.", "It's a transform boundary where the Pacific and North American Plates slide past each other.", "LA moves ~46 mm closer to San Francisco each year.", "The 1906 San Francisco earthquake resulted from this motion."]}, {"q": "These five lakes — remembered with the acronym HOMES — contain about 20% of Earth's surface fresh water. Their largest by surface area is the largest freshwater lake on Earth. One of them is entirely within the United States; the others form part of the US-Canada border. The St. Lawrence Seaway connects them to the Atlantic. Name this group and its largest member.", "a": "Great Lakes (largest: Lake Superior)", "c": ["Remembered by the acronym HOMES: Huron, Ontario, Michigan, Erie, Superior.", "They contain about 20% of Earth's surface fresh water.", "Lake Michigan is the only one entirely within the US.", "The St. Lawrence Seaway connects them to the Atlantic Ocean."]}, {"q": "This mountain system, stretching 4,800 km from British Columbia to New Mexico, is North America's longest. The Continental Divide runs along its spine, determining whether water drains to the Pacific or to the Gulf of Mexico and Atlantic. Yellowstone, Glacier, and Grand Teton National Parks all lie within it. Name it.", "a": "Rocky Mountains", "c": ["North America's longest mountain system: 4,800 km from BC to New Mexico.", "The Continental Divide runs along its spine.", "Precipitation drains either to the Pacific or to the Gulf/Atlantic.", "Yellowstone, Glacier, and Grand Teton parks are within it."]}, {"q": "Canada's easternmost province pairs an island with a mainland region. The island's northern tip, L'Anse aux Meadows, is the only confirmed Norse settlement in North America, dating to around 1000 AD. This province also has a rare half-hour time zone offset from Atlantic Standard Time. Name it.", "a": "Newfoundland and Labrador", "c": ["Canada's easternmost province: an island plus mainland Labrador.", "L'Anse aux Meadows on its northern tip is the only confirmed Viking settlement in North America.", "Joined Canada in 1949.", "Its time zone is UTC -3:30 — a rare 30-minute offset."]}, {"q": "This California national park holds the world's highest reliably measured air temperature (134 degrees F in 1913). Its Badwater Basin is the lowest point in North America at 282 feet below sea level — yet just 84 miles from the contiguous US's highest peak. Its 'sailing stones' moved across the desert floor for decades before scientists explained the mechanism. Name it.", "a": "Death Valley National Park", "c": ["Holds the world-record high air temperature: 134 degrees F (1913).", "Badwater Basin: lowest point in North America at 282 ft below sea level.", "Only 84 miles from Mount Whitney, highest peak in the contiguous US.", "Its 'sailing stones' puzzled scientists for decades."]}, {"q": "This hook-shaped Massachusetts peninsula, formed by glacial outwash, is separated from the mainland by a canal. The Pilgrims landed here in 1620 before sailing on to Plymouth. An island popular for its gingerbread cottages and Kennedy family connections lies just to its south. Name this peninsula and the island to its south.", "a": "Cape Cod (Martha's Vineyard to the south)", "c": ["A hook-shaped peninsula in Massachusetts formed by glacial deposits.", "Separated from the mainland by the Cape Cod Canal.", "The Pilgrims landed here in 1620 before continuing to Plymouth.", "Martha's Vineyard lies just to its south."]}, {"q": "This South Carolina harbor city's Fort Sumter saw the opening artillery barrage of the American Civil War on April 12, 1861. It is the largest city in its state and is celebrated for its antebellum architecture, cobblestone streets, and Lowcountry cuisine — she-crab soup and shrimp and grits. Name it.", "a": "Charleston, South Carolina", "c": ["Fort Sumter in its harbor saw the Civil War's first shots on April 12, 1861.", "It is South Carolina's largest city.", "Known for antebellum architecture and cobblestone streets.", "Lowcountry cuisine: she-crab soup, shrimp and grits."]}, {"q": "This Utah national park is not actually a canyon but a series of natural amphitheaters along the edge of a plateau. It holds the world's highest concentration of hoodoos — thin rock spires formed by frost wedging. Its colorful sedimentary layers were deposited in ancient lakes and rivers. Name it.", "a": "Bryce Canyon National Park", "c": ["Located in Utah; not a canyon but a series of natural amphitheaters.", "Home to the world's highest concentration of hoodoos.", "Hoodoos form by frost wedging — freezing water prying rock apart.", "Colorful sedimentary rock layers from ancient lake deposits."]}, {"q": "This southwestern US state contains one of the world's great natural wonders — a mile-deep river gorge — and a capital city in the Valley of the Sun that is the fifth-largest in the US. Together with Hawaii, this state does not observe Daylight Saving Time. Name it and its capital.", "a": "Arizona (capital: Phoenix)", "c": ["Contains the Grand Canyon — a mile-deep river gorge cut by the Colorado River.", "Its capital is the fifth-largest US city, in the Valley of the Sun.", "Along with Hawaii, it does not observe Daylight Saving Time.", "The Salt and Gila Rivers converge near its capital."]}, {"q": "This peninsula in northwestern Washington State, bounded by the Pacific, the Strait of Juan de Fuca, and Puget Sound, contains one of the few temperate rainforests in the contiguous US, receiving about 140 inches of rain annually. Geographic isolation here produced unique species — including a marmot and a mudminnow — found nowhere else on Earth. Name it.", "a": "Olympic Peninsula", "c": ["In northwestern Washington State, bounded by the Pacific, Strait of Juan de Fuca, and Puget Sound.", "Contains the Hoh Rain Forest — one of the few US temperate rainforests.", "Receives about 140 inches of rain annually.", "Geographic isolation produced the Olympic marmot and Olympic mudminnow, found nowhere else."]}, {"q": "This Hawaiian island, though only the third-largest in the chain, is home to about 70% of Hawaii's population and to the state capital. Japan's surprise attack on its naval base on December 7, 1941 drew the United States into World War II. An extinct volcanic tuff cone overlooking its famous beach is one of the state's most recognizable landmarks. Name it.", "a": "Oahu", "c": ["Third-largest Hawaiian island but home to 70% of the state's population.", "Japan attacked its naval base — Pearl Harbor — on December 7, 1941.", "Honolulu, the state capital, is located here.", "Diamond Head, an extinct volcanic tuff cone, overlooks Waikiki Beach."]}, {"q": "This group of 22 Wisconsin islands in Lake Superior is a National Lakeshore managed by the National Park Service. Despite a name suggesting 12 apostles, Jesuit missionaries miscounted. The islands are famous for sandstone sea caves, historic lighthouses, and ice caves that form when the lake freezes. Name them.", "a": "Apostle Islands", "c": ["22 islands in Lake Superior off northern Wisconsin.", "Named by Jesuit missionaries who apparently miscounted (name implies 12).", "Famous for sandstone sea caves and historic lighthouses.", "Ice caves form along the shoreline when the lake freezes in cold winters."]}, {"q": "This southern US state is home to Walmart's global headquarters in Bentonville, the only publicly accessible diamond mine in the US at Crater of Diamonds State Park, and the 1957 civil rights flashpoint at Central High School. Name this state and its capital.", "a": "Arkansas (capital: Little Rock)", "c": ["Walmart's global HQ is in Bentonville, a city in this state.", "Crater of Diamonds State Park: the only publicly accessible diamond mine in the US.", "The Little Rock Nine integrated Central High School here in 1957 — a key Civil Rights moment.", "The capital is Little Rock."]}, {"q": "This Los Angeles neighborhood is the historic center of American cinema. Its iconic sign originally read 'Hollywoodland' in 1923, advertising a real estate development. Its name is shared by a Florida city near Fort Lauderdale, occasionally causing confusion in geography questions. Name it.", "a": "Hollywood", "c": ["Historic center of American cinema, in Los Angeles.", "Its sign originally read 'Hollywoodland' — a 1923 real estate advertisement.", "Its name is shared by a city in Florida near Fort Lauderdale.", "The Walk of Fame here has over 2,700 stars."]}, {"q": "This Connecticut maritime village is home to Mystic Seaport, one of the world's largest maritime history museums, preserving 19th-century wooden sailing vessels. The 1988 film of the same name helped make it a household word. The Connecticut River — longest named for a New England state — flows through the broader state. Name it.", "a": "Mystic, Connecticut", "c": ["A Connecticut village home to Mystic Seaport, one of the world's largest maritime museums.", "It preserves 19th-century wooden sailing ships.", "The 1988 film 'Mystic Pizza' (Julia Roberts) was set here.", "The Connecticut River — longest named for a New England state — flows through the broader area."]}, {"q": "New Orleans is famous as the birthplace of jazz and for which annual pre-Lenten celebration involving parades and music?", "a": "Mardi Gras", "c": ["This Louisiana city is the birthplace of jazz.", "It is famous for Cajun and Creole cuisine.", "It hosts the largest pre-Lenten carnival celebration in the United States.", "The event involves parades, floats, and music in the French Quarter."]}, {"q": "This Canadian island, the world's fifth-largest, is located almost entirely above the Arctic Circle in the territory of Nunavut. It was named after English navigator William Baffin who charted it in 1616. The territorial capital, Iqaluit, sits on its southeastern shore. Name this island.", "a": "Baffin Island", "c": ["World's fifth-largest island.", "Almost entirely above the Arctic Circle.", "Part of Nunavut territory, Canada.", "Named after William Baffin, who charted it in 1616."]}, {"q": "Tectonic forces on the San Andreas Fault are moving the Pacific Plate northwest relative to the North American Plate. Which two California cities are being slowly brought closer together as a result?", "a": "Los Angeles and San Francisco", "c": ["The San Andreas Fault is a transform boundary in California.", "The Pacific Plate moves northwest relative to the North American Plate.", "Two of California's largest cities are moving closer together at about 46 mm per year.", "They are on opposite ends of the state."]}, {"q": "This hook-shaped Massachusetts peninsula was the Pilgrims' first landing point in 1620. A canal separates it from the mainland. Martha's Vineyard lies directly to its south. Name this peninsula.", "a": "Cape Cod", "c": ["A hook-shaped Massachusetts peninsula formed by glacial outwash.", "The Pilgrims landed here in 1620 before continuing to Plymouth.", "Separated from the mainland by the Cape Cod Canal.", "Martha's Vineyard lies directly to its south."]}, {"q": "This Central American country borders Guatemala to the west, El Salvador to the southwest, and Nicaragua to the east. Its ancient Maya site of Copan — famous for carved stelae and a Hieroglyphic Stairway — is a UNESCO World Heritage Site. Its Bay Islands are a world-class dive destination. Name it and its capital.", "a": "Honduras (capital: Tegucigalpa)", "c": ["Borders Guatemala, El Salvador, and Nicaragua.", "The Maya site of Copan, with its Hieroglyphic Stairway, is a UNESCO site within it.", "The Bay Islands off its Caribbean coast are famous for scuba diving.", "Its capital is Tegucigalpa."]}, {"q": "This Patagonian glacier in Argentina's Los Glaciares National Park is one of the world's few still actively advancing rather than retreating. It periodically dams a section of Lake Argentino; pressure builds until the ice wall spectacularly collapses. It is part of Earth's third-largest freshwater reserve. Name it.", "a": "Perito Moreno Glacier", "c": ["Located in Los Glaciares National Park, Patagonia, Argentina.", "One of the world's few glaciers still advancing rather than retreating.", "It periodically dams Lake Argentino; the ice wall eventually collapses spectacularly.", "Part of the Southern Patagonian Ice Field — Earth's third-largest freshwater reserve."]}, {"q": "This South American lake straddles the Peru-Bolivia border at about 3,810 meters above sea level — the world's highest navigable lake for large vessels. The Uros people live on floating totora-reed islands here. In Inca myth, the creator god Viracocha rose from its depths to make the sun and moon. It is South America's largest lake by surface area. Name it.", "a": "Lake Titicaca", "c": ["On the Peru-Bolivia border at ~3,810 m — world's highest navigable lake for large vessels.", "The Uros people live on floating islands woven from totora reeds.", "Inca myth: creator god Viracocha emerged from it to create the sun and moon.", "South America's largest lake by surface area."]}, {"q": "This Caribbean island nation has been under communist rule since Fidel Castro's 1959 revolution. The United States imposed a trade embargo that remains largely in place. Its capital is famous for Spanish colonial architecture, vintage American cars, and vibrant music culture. It is the Caribbean's largest island, about 90 miles from Key West, Florida. Name it and its capital.", "a": "Cuba (capital: Havana)", "c": ["Communist rule since Fidel Castro's 1959 revolution.", "US trade embargo remains largely in effect.", "Its capital is known for colonial architecture, vintage cars, and music.", "Largest Caribbean island, about 90 miles from Key West, Florida."]}, {"q": "This tiny two-island Caribbean nation is the smallest sovereign state in the Americas by both area and population. St. Kitts was the first Caribbean island colonized by the British, in 1623. Brimstone Hill Fortress on the main island is a UNESCO World Heritage Site. It offers one of the world's oldest citizenship-by-investment programs. Name it.", "a": "Saint Kitts and Nevis", "c": ["Smallest sovereign state in the Americas by area and population.", "St. Kitts was first colonized by the British in 1623 — the first British Caribbean colony.", "Brimstone Hill Fortress is a UNESCO World Heritage Site.", "It has one of the world's oldest citizenship-by-investment programs."]}, {"q": "This Mexico City boulevard was modeled on Paris's Champs-Elysees and commissioned by Emperor Maximilian I in the 1860s. It is home to the Angel of Independence — El Angel — one of the city's most iconic monuments, and passes near Chapultepec Castle. Today it is the financial heart of Mexico City. Name it.", "a": "Paseo de la Reforma", "c": ["Mexico City boulevard modeled on Paris's Champs-Elysees.", "Commissioned by Emperor Maximilian I in the 1860s.", "Home to El Angel (Angel of Independence), one of Mexico City's iconic monuments.", "Today it is Mexico City's main financial corridor."]}, {"q": "This Central American country between Guatemala and Nicaragua has the ancient Maya site of Copan in its western region, famous for its Hieroglyphic Stairway. Its capital, often mispronounced, is spelled T-e-g-u-c-i-g-a-l-p-a. Name this country.", "a": "Honduras", "c": ["Between Guatemala and Nicaragua.", "Maya site of Copan features the famous Hieroglyphic Stairway.", "Capital: Tegucigalpa.", "Former member of the United Provinces of Central America."]}, {"q": "This Patagonian glacier is unusual because it is advancing in an era when most glaciers are retreating. Located within Los Glaciares National Park near the city of El Calafate, it periodically dams a branch of Lake Argentino. The resulting pressure eventually causes a spectacular ice arch to collapse. Name this glacier.", "a": "Perito Moreno Glacier", "c": ["Advancing glacier — unusual today.", "Los Glaciares National Park, Argentina, near El Calafate.", "Ice arch collapses into Lake Argentino periodically.", "Part of the third-largest freshwater reserve on Earth."]}, {"q": "Straddling the border between Peru and Bolivia at nearly 3,900 meters elevation, this South American lake is the highest in the world navigable for large vessels. Inca mythology held that the creator god Viracocha arose from its depths. The Uros people live on floating islands built from totora reeds. It is South America's largest lake by surface area. Name it.", "a": "Lake Titicaca", "c": ["Highest navigable lake for large vessels — Peru-Bolivia border.", "Viracocha creation myth.", "Uros people on reed islands.", "South America's largest lake by surface area."]}, {"q": "This two-island Eastern Caribbean nation holds the dual distinction of being the smallest sovereign state in the Americas. Colonized first by the British in 1623, it quickly became a sugar powerhouse. Its Brimstone Hill Fortress is a UNESCO World Heritage Site. Name this nation.", "a": "Saint Kitts and Nevis", "c": ["Smallest sovereign state in the Americas.", "First British Caribbean colony, established 1623.", "Brimstone Hill Fortress is a UNESCO World Heritage Site.", "Home to one of the world's oldest citizenship-by-investment programs."]}, {"q": "This coastal Mexican boulevard was modeled on the Champs-Elysees in Paris and commissioned by Emperor Maximilian I in the 1860s. Today it is Mexico City's main financial corridor, lined with skyscrapers and foreign embassies. Its most famous monument, the Angel of Independence, commemorates Mexico's independence heroes. Name this avenue.", "a": "Paseo de la Reforma", "c": ["Modeled on Champs-Elysees, commissioned by Emperor Maximilian I.", "Mexico City's main financial corridor.", "Angel of Independence monument stands on it.", "Near Chapultepec Castle and Park."]}, {"q": "This type of geological feature is a hot spring that periodically erupts, shooting a column of boiling water and steam skyward. Underground water heated by nearby magma builds pressure until it releases. The English word for this feature derives from Iceland's most famous example. About 1,000 exist worldwide, mostly in five countries. What is this feature?", "a": "Geyser", "c": ["A hot spring that periodically shoots boiling water and steam upward.", "Underground water is heated by magma close to the surface.", "The English word derives from Iceland's famous 'Geysir.'", "About 1,000 exist worldwide; most are in five countries including the US and Iceland."]}, {"q": "This landform is a long, steep cliff or slope that marks the boundary between two relatively flat areas at different elevations. It can be created by tectonic faulting — one block of crust dropping — or by differential erosion, where soft rock wears away to expose a hard rock face. One famous example runs from New York State through Ontario. What is this landform?", "a": "Escarpment", "c": ["A steep cliff or slope separating two flat areas at different elevations.", "Formed by tectonic faulting or differential erosion.", "The Niagara example runs from New York through Ontario.", "The Great Escarpment of southern Africa is one of the world's most dramatic."]}, {"q": "This coastal feature forms where a river's freshwater meets and mixes with ocean saltwater in a partially enclosed body of water. These are among the world's most biologically productive ecosystems, serving as fish nurseries, pollution filters, and storm buffers. The Chesapeake Bay is the largest in the United States. What are these features called?", "a": "Estuary", "c": ["A partially enclosed coastal water body where river freshwater mixes with ocean saltwater.", "Among the most biologically productive ecosystems on Earth.", "Functions as a fish nursery, pollution filter, and storm buffer.", "The Chesapeake Bay is the largest US example."]}, {"q": "These natural resources — primarily tin, tantalum, tungsten, and gold, collectively called the '3TG' — are mined in conflict zones and sold to finance armed groups. They appear in virtually all modern smartphones, laptops, and gaming consoles. The eastern DRC is the most notorious source region. What are these materials collectively called?", "a": "Conflict minerals", "c": ["Natural resources mined in conflict zones and sold to finance armed groups.", "The primary ones are tin, tantalum, tungsten, and gold ('3TG').", "Found in virtually all smartphones, laptops, and gaming consoles.", "Eastern Democratic Republic of the Congo is the most notorious source."]}, {"q": "These shoreline formations are created when lava flows rapidly cool on contact with ocean water, shattering basalt into fine dark grains. Their dark color means they absorb significantly more heat from sunlight than typical white-sand beaches. Famous examples include a beach in Iceland's Vik, Punaluu Beach in Hawaii, and beaches in Greece's Santorini. What are these beaches called?", "a": "Black sand beaches", "c": ["Formed when lava meets ocean water and rapidly cools, shattering basalt.", "Their dark color absorbs more solar heat than white-sand beaches.", "Famous examples: Vik (Iceland), Punaluu (Hawaii), Santorini (Greece).", "Even rarer volcanic beaches exist in green (olivine) and red (iron cinder) varieties."]}, {"q": "This geological feature occurs where underground water is heated by magma close to Earth's surface, eventually building enough pressure to shoot boiling water and steam skyward. Its English name derives from Iceland's 'Geysir.' Old Faithful in Yellowstone National Park is the world's most famous example. What is this feature?", "a": "Geyser", "c": ["Underground water heated by magma builds pressure until it releases.", "Erupts periodically, shooting hot water and steam skyward.", "English name from Iceland's 'Geysir.'", "Old Faithful in Yellowstone is the world's most famous example."]}, {"q": "This term describes a steep cliff or slope marking the boundary between two flat areas at different elevations, formed by tectonic faulting or differential erosion. The Niagara version runs from New York State through Ontario. The Great version in southern Africa is one of the world's most dramatic. What landform is this?", "a": "Escarpment", "c": ["Steep cliff between two flat areas at different elevations.", "Formed by faulting or differential erosion.", "The Niagara Escarpment runs from New York through Ontario.", "The Great Escarpment in southern Africa is a famous example."]}, {"q": "This partially enclosed coastal water body forms where a river's fresh water mixes with oceanic saltwater. Among the world's most biologically productive ecosystems — serving as fish nurseries, pollutant filters, and storm surge buffers. The Chesapeake Bay is the largest example in the United States. What is this feature called?", "a": "Estuary", "c": ["Partially enclosed coastal body where river freshwater meets ocean saltwater.", "Among the world's most biologically productive ecosystems.", "Functions as a fish nursery, pollutant filter, and storm surge buffer.", "The Chesapeake Bay is the US's largest example."]}, {"q": "The tin, tantalum, tungsten, and gold known collectively as the '3TG' are natural resources mined in conflict zones and sold to finance armed groups. They are found in virtually every modern smartphone, laptop, and gaming console. Their extraction in the eastern Democratic Republic of the Congo has helped fund decades of devastating armed conflict. What are these resources collectively called?", "a": "Conflict minerals", "c": ["Tin, tantalum, tungsten, and gold (3TG).", "Sold to finance armed groups.", "Found in smartphones and laptops.", "Eastern DRC is the major source."]}, {"q": "These dark-colored beaches form when lava rapidly cools on contact with the ocean, shattering basalt into fine dark grains. They absorb more solar heat than white-sand beaches due to their dark color. Famous examples include Vik in Iceland and Punaluu in Hawaii. What are these beaches called?", "a": "Black sand beaches", "c": ["Formed by lava meeting ocean water and rapidly cooling, shattering basalt.", "Absorb more solar heat than white-sand beaches.", "Famous examples: Vik, Iceland; Punaluu, Hawaii; Santorini, Greece.", "Green and red sand beaches also exist from other volcanic minerals."]}, {"q": "This Southeast Asian country's narrow Isthmus of Kra separates the Andaman Sea from the Gulf of Thailand. It was the only mainland Southeast Asian country never colonized by Europeans, acting as a buffer between British India and French Indochina. Its capital city sits within a major river delta. Name this country and its capital.", "a": "Thailand (capital: Bangkok)", "c": ["Its Isthmus of Kra separates the Andaman Sea from the Gulf of Thailand.", "Only mainland Southeast Asian country never colonized by Europeans.", "Acted as a buffer between British India and French Indochina.", "Capital Bangkok sits in the Chao Phraya River delta."]}, {"q": "This ancient city in Israel is home to the Western Wall (Judaism's holiest accessible prayer site), the Church of the Holy Sepulchre (believed site of Jesus's crucifixion and burial), and the Al-Aqsa Mosque (Islam's third holiest site). Both the Israeli and Palestinian governments claim it as their capital. Name it.", "a": "Jerusalem", "c": ["Western Wall for Jews — holiest accessible prayer site.", "Church of the Holy Sepulchre for Christians — believed site of crucifixion and burial.", "Al-Aqsa Mosque for Muslims — Islam's third holiest site.", "Both Israel and Palestine claim it as their capital."]}, {"q": "This island, shared by three countries, is the world's third-largest. Its oldest rainforests — estimated at 130 million years — shelter orangutans and pygmy elephants. One country calls its 73% share 'Kalimantan'; two northern states of another country and a small monarchy hold the rest. Name it.", "a": "Borneo", "c": ["World's third-largest island.", "130-million-year-old rainforests shelter orangutans and pygmy elephants.", "Indonesia calls its 73% share 'Kalimantan.'", "Malaysia (Sabah and Sarawak) and Brunei hold the northern portion."]}, {"q": "New Zealand's indigenous Polynesian people, who arrived on the islands around 1300 AD, are known by this name. Their language, customs, and haka (ceremonial dance) are central to the country's national identity. The Treaty of Waitangi (1840) was signed between these people and the British Crown. Name them.", "a": "Maori", "c": ["Indigenous Polynesian people of New Zealand.", "Arrived in New Zealand around 1300 AD.", "Their haka, language, and customs are central to NZ national identity.", "The 1840 Treaty of Waitangi was signed between them and the British Crown."]}, {"q": "This island in the southern Pacific is the southernmost country of Oceania, consisting of a North Island (with geothermal features and volcanoes) and a South Island (with the Southern Alps and fjords). Its indigenous Maori people arrived around 1300 AD. Name it.", "a": "New Zealand", "c": ["Southernmost country of Oceania.", "Consists of a North Island and a South Island.", "South Island has the Southern Alps and fjords; North Island has volcanoes and geothermal features.", "Its indigenous Maori people arrived around 1300 AD."]}, {"q": "This sea between India and the Arabian Peninsula is connected to the Red Sea by the Bab-el-Mandeb and to the Persian Gulf through the Strait of Hormuz. The island of Socotra — home to the dragon blood tree — lies within it. Name it.", "a": "Arabian Sea", "c": ["Lies between India and the Arabian Peninsula.", "Connected to the Red Sea via the Bab-el-Mandeb.", "Connected to the Persian Gulf via the Strait of Hormuz.", "The island of Socotra, home to the dragon blood tree, is within it."]}, {"q": "This mountain on the Nepal-Sikkim border, at 8,586 meters, is the world's third-highest peak. Its Tibetan name translates to 'Five Treasures of Snow.' Out of respect for the Sikkimese, who regard it as sacred, mountaineers traditionally stop a few meters short of the true top. Name it.", "a": "Kangchenjunga", "c": ["Third-highest mountain in the world at 8,586 meters.", "Nepal-Sikkim border.", "Name means 'Five Treasures of Snow' in Tibetan.", "Climbers stop just short of the true summit out of sacred respect."]}, {"q": "This strait, running through Istanbul, links the Black Sea to the Sea of Marmara and separates Turkey's European and Asian halves. At its narrowest it is only about 700 meters wide. Russia's Black Sea fleet must pass through it to reach the Mediterranean. Name it.", "a": "Bosporus", "c": ["Divides European and Asian Turkey.", "Links the Black Sea to the Sea of Marmara.", "Only about 700 meters wide at its narrowest.", "Russia's Black Sea fleet must pass through it to reach the Mediterranean."]}, {"q": "This mountain system running from British Columbia to New Mexico is North America's longest. The Continental Divide runs along its spine. Famous parks within it include Yellowstone, Grand Teton, and Glacier. Name this mountain system.", "a": "Rocky Mountains", "c": ["North America's longest mountain system.", "From British Columbia to New Mexico.", "Continental Divide runs along its spine.", "Contains Yellowstone, Grand Teton, and Glacier National Parks."]}, {"q": "This Canadian province, the easternmost in the country, joined confederation in 1949. L'Anse aux Meadows on its island's northern tip is the only confirmed Norse settlement in North America. It observes a unique UTC-3:30 time zone. Name it.", "a": "Newfoundland and Labrador", "c": ["Canada's easternmost province, joined confederation in 1949.", "L'Anse aux Meadows: only confirmed Norse settlement in North America.", "Observes UTC -3:30 — a rare half-hour time zone.", "Consists of an island and mainland Labrador."]}, {"q": "This California desert park holds the world's highest reliably recorded air temperature (134 degrees F in 1913) and the lowest point in North America (Badwater Basin at 282 ft below sea level). 'Sailing stones' that appeared to move on their own fascinated scientists for decades. Name it.", "a": "Death Valley National Park", "c": ["Holds the world's highest reliably recorded air temperature: 134 degrees F (1913).", "Badwater Basin: lowest point in North America at 282 ft below sea level.", "'Sailing stones' appeared to move on their own.", "Only 84 miles from Mount Whitney, highest peak in the contiguous US."]}, {"q": "This peninsula in northwestern Washington State is bounded by the Pacific Ocean, Puget Sound, and the Strait of Juan de Fuca. Its Hoh Rain Forest receives about 140 inches of rain annually. Geographic isolation here produced unique species including the Olympic marmot. Name it.", "a": "Olympic Peninsula", "c": ["Bounded by Pacific Ocean, Puget Sound, and Strait of Juan de Fuca.", "The Hoh Rain Forest receives about 140 inches of rain annually.", "Geographic isolation created unique species like the Olympic marmot.", "Olympic National Park occupies much of it."]}, {"q": "This Hawaiian island, home to Pearl Harbor, was attacked by Japan on December 7, 1941, drawing the US into World War II. It is the third-largest Hawaiian island but houses about 70% of the state's population. Diamond Head volcanic crater overlooks Waikiki Beach here. Name it.", "a": "Oahu", "c": ["Japan attacked Pearl Harbor on this island on December 7, 1941.", "Third-largest Hawaiian island but home to 70% of the state's population.", "Honolulu, the state capital, is here.", "Diamond Head volcanic crater overlooks Waikiki Beach."]}, {"q": "These 22 islands in Lake Superior off northern Wisconsin are a National Lakeshore. Their Jesuit missionary namers apparently miscounted. Known for sandstone sea caves, lighthouses, and ice caves that form in cold winters. Name them.", "a": "Apostle Islands", "c": ["22 islands in Lake Superior off northern Wisconsin.", "Jesuit missionaries apparently miscounted when naming them.", "Known for sandstone sea caves and historic lighthouses.", "Ice caves form when Lake Superior freezes in cold winters."]}, {"q": "This southern US state is home to Walmart's headquarters in Bentonville, the only publicly accessible diamond mine in the US, and the 1957 Central High School integration landmark. Name this state and its capital.", "a": "Arkansas (capital: Little Rock)", "c": ["Walmart's global HQ is in its city of Bentonville.", "Crater of Diamonds State Park: only publicly accessible diamond mine in the US.", "Central High School integration (1957) was a key Civil Rights landmark here.", "Capital: Little Rock."]}, {"q": "This Los Angeles neighborhood is the historic center of American cinema. Its iconic sign originally read 'Hollywoodland' in 1923. Its name is shared by a Florida city near Fort Lauderdale. The Walk of Fame here has over 2,700 stars. Name it.", "a": "Hollywood", "c": ["Historic center of American cinema, in Los Angeles.", "Sign originally read 'Hollywoodland' — a 1923 real estate ad.", "Name shared by a Florida city near Fort Lauderdale.", "Walk of Fame has over 2,700 stars."]}, {"q": "This Connecticut village is home to one of the world's largest maritime history museums, preserving 19th-century wooden sailing ships. The 1988 film of the same name starred Julia Roberts. Name it.", "a": "Mystic, Connecticut", "c": ["Connecticut village home to one of the world's largest maritime museums.", "Preserves 19th-century wooden sailing ships.", "The 1988 film 'Mystic Pizza' (Julia Roberts) was set here.", "The Connecticut River flows through the broader region."]}];
const REGIONS=[{"id": "africa", "name": "Africa", "emoji": "🌍", "desc": "Rivers, mountains, conflict, ecology", "topics": [{"title": "Niger River", "facts": [{"l": "Key Fact", "t": "Africa's third-longest river (after Nile and Congo). Shares its name with two countries: Niger and Nigeria."}, {"l": "Geography", "t": "Flows in a boomerang curve through Guinea, Mali, Niger, and Nigeria. Its Inner Delta near Timbuktu is one of Africa's largest wetlands."}, {"l": "History", "t": "Timbuktu on the Niger was a great center of Islamic scholarship and the gold-salt trade in the medieval period."}], "mnem": "🧠 NIG-er flows through NIG-er and NIG-eria — the name links all three.", "tags": ["River", "West Africa", "Third-Longest"], "bbox": "-3,5,25,20"}, {"title": "Mount Kilimanjaro", "facts": [{"l": "Key Fact", "t": "Tanzania's Kilimanjaro is Africa's tallest peak (5,895 m / 19,341 ft) and the world's tallest free-standing mountain."}, {"l": "Geology", "t": "A dormant stratovolcano with three cones: Kibo (highest), Mawenzi, and Shira. Its shrinking glaciers are a visible sign of climate change."}, {"l": "Culture", "t": "The Chagga people farm coffee and bananas on its slopes. The name may come from Swahili: kilima (hill) + njaro (whiteness)."}], "mnem": "🧠 Kibo, Mawenzi, Shira — three cones, Tanzania, tallest free-standing mountain in the world.", "tags": ["Mountain", "Tanzania", "Dormant Volcano"], "bbox": "36.5,-3.8,37.8,-2.5"}, {"title": "Somalia", "facts": [{"l": "Key Fact", "t": "Somalia occupies the Horn of Africa east of Ethiopia. Longest mainland African coastline. Capital: Mogadishu."}, {"l": "Politics", "t": "Al-Shabaab militants are based here; they carried out the 2013 Nairobi Westgate Mall attack. Civil war began in 1991."}, {"l": "Geography", "t": "Piracy off Somalia's coast became a major global concern in the 2000s-2010s."}], "tags": ["Horn of Africa", "Al-Shabaab", "Indian Ocean"], "bbox": "40,0,52,12"}, {"title": "Lake Turkana", "facts": [{"l": "Key Fact", "t": "World's largest permanent desert lake and largest alkaline lake, in Kenya's Great Rift Valley. Formerly Lake Rudolf."}, {"l": "Science", "t": "Some of the oldest known hominid fossils were found on its shores — nicknamed 'Cradle of Mankind.'"}, {"l": "Geography", "t": "The Omo River from Ethiopia is its main source. It lies in a hot, arid landscape in northern Kenya."}], "tags": ["Lake", "Kenya", "Fossils", "Rift Valley"], "bbox": "35.5,2,37,5"}, {"title": "The Sahel", "facts": [{"l": "Key Fact", "t": "A semi-arid belt across Africa just south of the Sahara, from Senegal to Eritrea. 'Sahel' is Arabic for 'shore.'"}, {"l": "Climate", "t": "Transition zone between desert and savanna. Prone to droughts and desertification. Countries: Mali, Niger, Burkina Faso, Chad, Sudan."}, {"l": "Politics", "t": "Several Sahel nations face serious security challenges from armed insurgent groups."}], "mnem": "🧠 Sahel = shore of the Sahara. South of desert, north of savanna.", "tags": ["Region", "Climate", "Desertification"], "bbox": "-18,10,40,20"}, {"title": "Congo Rainforest", "facts": [{"l": "Key Fact", "t": "Second-largest tropical rainforest (after the Amazon), spanning the Congo Basin."}, {"l": "Ecology", "t": "Home to gorillas, forest elephants, bonobos, and okapis. Acts as a massive global carbon sink."}, {"l": "Conflict", "t": "Eastern DRC is a source of conflict minerals — coltan, tin, tungsten, gold — that fund armed groups."}], "tags": ["Rainforest", "Congo", "Carbon Sink", "Conflict Minerals"], "bbox": "10,-5,30,5"}]}, {"id": "asia", "name": "Asia", "emoji": "🏯", "desc": "Rivers, capitals, straits, islands, passes", "topics": [{"title": "Philippines & Manila", "facts": [{"l": "Key Fact", "t": "Southeast Asian archipelago of 7,600+ islands. Capital: Manila, on Luzon."}, {"l": "Geography", "t": "Three main island groups: Luzon (north), Visayas (center), Mindanao (south). On the Pacific Ring of Fire."}, {"l": "History", "t": "Over 300 years of Spanish colonization, then American rule. Filipino (Tagalog-based) and English are both official."}], "tags": ["Archipelago", "Southeast Asia", "Ring of Fire"], "bbox": "116,5,128,20"}, {"title": "Yangtze River", "facts": [{"l": "Key Fact", "t": "Longest river in China and Asia; third-longest in the world. Tibetan Plateau to East China Sea at Shanghai."}, {"l": "Engineering", "t": "The Three Gorges Dam on the Yangtze is the world's largest hydroelectric power station."}, {"l": "History", "t": "Historically divided northern and southern China. Major cities along it: Chongqing, Wuhan, Nanjing, Shanghai."}], "mnem": "🧠 Yangtze = longest in China. Three Gorges Dam. Empties at Shanghai.", "tags": ["River", "China", "Asia-Longest"], "bbox": "90,24,122,36"}, {"title": "Bangkok & Chao Phraya", "facts": [{"l": "Key Fact", "t": "Bangkok, capital of Thailand, sits within the Chao Phraya River delta. Nicknamed 'Venice of the East.'"}, {"l": "History", "t": "Thailand (formerly Siam) is the only Southeast Asian country never colonized by Europeans."}, {"l": "Geography", "t": "The Isthmus of Kra separates the Andaman Sea (west) from the Gulf of Thailand (east)."}], "tags": ["Capital", "Thailand", "River Delta"], "bbox": "99.8,13,101,14.5"}, {"title": "Jerusalem", "facts": [{"l": "Key Fact", "t": "Holy to Judaism (Western Wall), Christianity (Church of Holy Sepulchre), and Islam (Al-Aqsa Mosque, Dome of the Rock)."}, {"l": "History", "t": "Jerusalem was Islam's original direction of prayer (qibla) before Mecca. The Via Dolorosa marks Jesus's path."}, {"l": "Politics", "t": "Both Israel and Palestine claim it as their capital. The Old City has four quarters: Jewish, Christian, Muslim, Armenian."}], "tags": ["Holy City", "Three Religions", "Israel", "Palestine"], "bbox": "35,31.6,35.4,31.95"}, {"title": "Borneo", "facts": [{"l": "Key Fact", "t": "Third-largest island, shared by Indonesia (Kalimantan, ~73%), Malaysia (Sabah & Sarawak), and Brunei."}, {"l": "Ecology", "t": "Rainforests estimated at 130 million years old. Home to orangutans, pygmy elephants, and the rafflesia."}, {"l": "Threats", "t": "Palm oil plantation expansion drives devastating deforestation and threatens the critically endangered Bornean orangutan."}], "mnem": "🧠 BIM: Brunei + Indonesia (Kalimantan) + Malaysia share Borneo.", "tags": ["Island", "Three Countries", "Rainforest"], "bbox": "108,-4,119,7"}, {"title": "Istanbul & Hagia Sophia", "facts": [{"l": "Key Fact", "t": "Hagia Sophia was built as a Christian cathedral in 537 AD, later a mosque, museum (1934), then mosque again (2020)."}, {"l": "Geography", "t": "Istanbul uniquely straddles two continents (Europe and Asia), divided by the Bosporus strait."}, {"l": "History", "t": "Previously named Byzantium and Constantinople, it controlled the Black Sea-Mediterranean trade route."}], "tags": ["Turkey", "Two Continents", "Bosporus", "Byzantine"], "bbox": "28.5,40.8,29.3,41.3"}, {"title": "Osaka", "facts": [{"l": "Key Fact", "t": "Japan's third-largest city, economic hub of the Kansai region. Historically nicknamed the 'Nation's Kitchen.'"}, {"l": "History", "t": "Osaka Castle built in 1583 by Toyotomi Hideyoshi. The city hosted World Expo 2025."}, {"l": "Culture", "t": "Birthplace of takoyaki (octopus balls) and okonomiyaki. The Dotonbori district is its famous entertainment area."}], "tags": ["Japan", "Kansai", "Food Culture"], "bbox": "135,34.3,135.8,34.9"}, {"title": "Strait of Hormuz", "facts": [{"l": "Key Fact", "t": "World's most important oil chokepoint: ~20-25% of global oil supply passes through it daily."}, {"l": "Geography", "t": "Squeezed between Iran (north) and Oman (south). Connects Persian Gulf to Gulf of Oman."}, {"l": "Strategy", "t": "Iran has repeatedly threatened to close it during international tensions."}], "tags": ["Strait", "Oil", "Iran", "Oman", "Chokepoint"], "bbox": "54,25,58,28"}, {"title": "Riyadh", "facts": [{"l": "Key Fact", "t": "Capital and largest city of Saudi Arabia, on the Najd plateau in the interior of the Arabian Peninsula."}, {"l": "Modern", "t": "Saudi Arabia's Vision 2030 plan aims to diversify the economy away from oil dependence."}, {"l": "Landmarks", "t": "The Kingdom Centre Tower is Riyadh's most recognizable skyscraper."}], "tags": ["Capital", "Saudi Arabia", "Desert", "Vision 2030"], "bbox": "46,24,47.2,25.2"}, {"title": "Khyber Pass", "facts": [{"l": "Key Fact", "t": "A mountain pass through the Hindu Kush connecting Afghanistan and Pakistan — historically one of the most strategic in the world."}, {"l": "History", "t": "Alexander the Great, Mughal emperors, and the British Raj all moved armies through it. A critical Silk Road route."}, {"l": "Geography", "t": "About 53 km long, ~1,070 m elevation. Peshawar, Pakistan sits at its eastern end."}], "tags": ["Mountain Pass", "Afghanistan", "Pakistan", "Silk Road"], "bbox": "70.5,33.5,71.5,34.5"}, {"title": "Red River (Asia)", "facts": [{"l": "Key Fact", "t": "Flows from Yunnan Province, China through northern Vietnam to the Gulf of Tonkin. Named for reddish-brown silt."}, {"l": "Geography", "t": "Vietnam's capital Hanoi sits on the Red River. Its delta is one of the most densely populated regions on Earth."}, {"l": "History", "t": "The Red River Delta has been the heartland of Vietnamese civilization for thousands of years."}], "tags": ["River", "Vietnam", "China", "Delta"], "bbox": "103,20,107,23"}, {"title": "Kowloon Walled City", "facts": [{"l": "Key Fact", "t": "Once the most densely populated place on Earth: 33,000+ residents in 6.4 acres in Hong Kong. Demolished 1993-94, now a park."}, {"l": "History", "t": "Existed in a legal gray zone — neither fully under British Hong Kong nor Chinese mainland jurisdiction."}, {"l": "Culture", "t": "Despite its reputation, it had functioning doctors, dentists, food stalls, and a tight-knit community."}], "tags": ["Hong Kong", "Urban", "Historical"], "bbox": "114.1,22.3,114.3,22.4"}, {"title": "Kangchenjunga", "facts": [{"l": "Key Fact", "t": "Third-highest mountain (8,586 m), on the Nepal-Sikkim (India) border. Name means 'Five Treasures of Snow.'"}, {"l": "Culture", "t": "Considered sacred by the Sikkimese people. Climbers stop a few meters below the true summit out of respect."}, {"l": "History", "t": "Before 19th-century surveys, it was believed to be the world's tallest mountain."}], "tags": ["Mountain", "Nepal", "Himalayas", "Third-Highest"], "bbox": "88,27,88.5,27.8"}]}, {"id": "oceania", "name": "Australia & Oceania", "emoji": "🦘", "desc": "Reefs, Antarctica, New Zealand, islands", "topics": [{"title": "Great Barrier Reef", "facts": [{"l": "Key Fact", "t": "World's largest structure made by living organisms. Stretches ~2,300 km off Queensland, Australia. Visible from space."}, {"l": "Ecology", "t": "Comprises nearly 3,000 individual reef systems. Supports 1,500+ fish species, sea turtles, dolphins."}, {"l": "Threats", "t": "Climate-driven coral bleaching — from rising ocean temperatures — is its gravest threat."}], "tags": ["Australia", "Reef", "UNESCO", "Marine"], "bbox": "143,-25,153,-10"}, {"title": "Antarctica", "facts": [{"l": "Key Fact", "t": "Earth's southernmost continent: coldest, driest, windiest. Holds ~70% of the world's fresh water in its ice sheet."}, {"l": "Politics", "t": "The Antarctic Treaty (1959) designates it for peaceful scientific research. No country owns it."}, {"l": "Scale", "t": "If Antarctica's ice fully melted, global sea levels would rise about 58 meters."}], "tags": ["Continent", "Ice", "Treaty", "Research"], "bbox": "-180,-90,180,-60"}, {"title": "New Zealand & Waitangi", "facts": [{"l": "Key Fact", "t": "Southernmost country of Oceania. Two main islands: North (volcanic, geothermal) and South (Southern Alps, fjords)."}, {"l": "History", "t": "The Treaty of Waitangi (1840) established British sovereignty while protecting Maori rights."}, {"l": "Culture", "t": "The Maori arrived around 1300 AD. Rotorua's geothermal region features geysers."}], "mnem": "🧠 Waitangi = New Zealand's founding treaty (1840). Maori arrived ~1300 AD.", "tags": ["Maori", "Treaty", "Southern Alps", "Geysers"], "bbox": "165,-48,179,-34"}, {"title": "McMurdo Station", "facts": [{"l": "Key Fact", "t": "Largest research station in Antarctica, operated by the United States on Ross Island. Houses 1,000+ researchers in summer."}, {"l": "Location", "t": "Nearest major city: Christchurch, New Zealand — over 3,800 km away."}, {"l": "Science", "t": "Hub for US Antarctic research in climate science, glaciology, biology, and astrophysics."}], "tags": ["Antarctica", "USA", "Research", "Ross Island"], "bbox": "166,-78,168,-77"}, {"title": "Micronesia", "facts": [{"l": "Key Fact", "t": "Pacific subregion meaning 'small islands': Palau, Marshall Islands, Guam, Kiribati, Nauru, FSM, and more."}, {"l": "Geography", "t": "Mostly low-lying coral atolls, severely threatened by rising sea levels."}, {"l": "History", "t": "Islands were controlled at various times by Spain, Germany, Japan, and the United States."}], "tags": ["Pacific", "Atolls", "Climate Change"], "bbox": "135,0,165,15"}]}, {"id": "europe", "name": "Europe", "emoji": "🏰", "desc": "Rivers, cities, straits, people, volcanoes", "topics": [{"title": "The Bosporus", "facts": [{"l": "Key Fact", "t": "Strait dividing Turkey's European and Asian halves, connecting Black Sea to Sea of Marmara. Only ~700 m at its narrowest."}, {"l": "Significance", "t": "Istanbul sits on both sides. Russia's Black Sea fleet must pass through it to reach the Mediterranean."}, {"l": "History", "t": "Control of the Bosporus has been fought over for millennia. The 1936 Montreux Convention governs who may pass."}], "tags": ["Strait", "Turkey", "Black Sea", "Istanbul"], "bbox": "28.8,40.95,29.2,41.2"}, {"title": "Danube River", "facts": [{"l": "Key Fact", "t": "Europe's second-longest river (after the Volga). Flows through or borders 10 countries — world record. Empties into Black Sea."}, {"l": "Capitals", "t": "Danube capitals west to east: Vienna (Austria), Bratislava (Slovakia), Budapest (Hungary), Belgrade (Serbia)."}, {"l": "Culture", "t": "Johann Strauss II's 'The Blue Danube' waltz is one of the most famous pieces of music ever written."}], "mnem": "🧠 Very Big Boys Bet: Vienna, Bratislava, Budapest, Belgrade — Danube capitals west to east.", "tags": ["River", "Ten Countries", "Trade"], "bbox": "8,42,30,50"}, {"title": "Rome", "facts": [{"l": "Key Fact", "t": "Capital of Italy, built on seven hills along the Tiber River. Tourist highlights: the Colosseum and the Trevi Fountain."}, {"l": "History", "t": "The Colosseum (80 AD) held 50,000 spectators. The Trevi Fountain tradition: toss a coin to guarantee your return."}, {"l": "Geography", "t": "Vatican City — the world's smallest country — is an enclave entirely within Rome."}], "tags": ["Capital", "Italy", "Colosseum", "Trevi Fountain", "Vatican"], "bbox": "12.3,41.8,12.6,42"}, {"title": "Black Sea & Crimea", "facts": [{"l": "Key Fact", "t": "Bordered by Turkey, Bulgaria, Romania, Ukraine, Russia, and Georgia. Crimea is a peninsula on its northern shore."}, {"l": "Politics", "t": "Russia annexed Crimea from Ukraine in 2014 — internationally condemned. Preceded Russia's 2022 full-scale invasion."}, {"l": "Science", "t": "Deep Black Sea waters are nearly devoid of oxygen (anoxic) — one of the world's largest dead zones."}], "tags": ["Sea", "Crimea", "Ukraine", "Geopolitics"], "bbox": "27,41,42,47"}, {"title": "Sicily", "facts": [{"l": "Key Fact", "t": "Largest island by area in the Mediterranean Sea. Part of Italy; separated from the mainland by the 3-km Strait of Messina."}, {"l": "Geology", "t": "Mount Etna on Sicily's eastern coast is Europe's tallest active volcano."}, {"l": "History", "t": "Successively ruled by Greeks, Romans, Arabs, Normans, and Spanish."}], "tags": ["Island", "Mediterranean", "Mount Etna", "Italy"], "bbox": "12,36.5,16,39"}, {"title": "Iberian Peninsula", "facts": [{"l": "Key Fact", "t": "Westernmost peninsula of mainland Europe, home to Spain and Portugal. Separated from France by the Pyrenees."}, {"l": "History", "t": "Under Moorish (Islamic) rule for roughly 800 years (711-1492), deeply influencing language, architecture, culture."}, {"l": "Cities", "t": "Lisbon, Portugal's capital, is the westernmost capital city in continental Europe."}], "tags": ["Peninsula", "Spain", "Portugal", "Pyrenees", "Gibraltar"], "bbox": "-10,36,4,44"}, {"title": "Oslo & Akershus Fortress", "facts": [{"l": "Key Fact", "t": "Akershus Fortress, built around 1299, sits on the Oslo waterfront and served as a royal residence, stronghold, and prison."}, {"l": "Language", "t": "Norwegian has two written standards: Bokmal ('Book Tongue,' ~85%) and Nynorsk ('New Norwegian')."}, {"l": "Geography", "t": "Norway's many fjords give it Europe's longest coastline. Bergen was the northernmost Hanseatic League member."}], "tags": ["Capital", "Norway", "Fortress", "Fjords"], "bbox": "10.5,59.85,10.9,59.95"}, {"title": "Schengen Area", "facts": [{"l": "Key Fact", "t": "Zone of 29 European countries with no passport controls at internal borders, named after a Luxembourg town (1985 agreement)."}, {"l": "Members", "t": "Includes non-EU members like Norway and Switzerland. Excludes some EU members like Ireland."}, {"l": "Travel", "t": "A single Schengen visa allows travel across all member states."}], "tags": ["Europe", "Borders", "Free Movement"], "bbox": "-12,35,35,72"}, {"title": "Naples & Stromboli", "facts": [{"l": "Key Fact", "t": "Naples sits on the Bay of Naples near Vesuvius — which buried Pompeii in 79 AD. Naples is the birthplace of pizza."}, {"l": "Stromboli", "t": "Stromboli, in the Aeolian Islands north of Sicily, has erupted nearly continuously for 2,000+ years — 'Lighthouse of the Mediterranean.'"}, {"l": "Culture", "t": "Naples has a UNESCO-designated historic center with underground Greek-Roman tunnels."}], "tags": ["Italy", "Volcano", "Pizza", "Aeolian Islands"], "bbox": "13,38,16,41"}, {"title": "Flemish People", "facts": [{"l": "Key Fact", "t": "The Flemish are the Dutch-speaking population of northern Belgium (Flanders). Belgium is split between Flemish north and French-speaking Wallonia south."}, {"l": "Culture", "t": "Jan van Eyck and Pieter Bruegel were Flemish masters. Brussels, the capital, is bilingual but mostly French-speaking."}, {"l": "Politics", "t": "Linguistic tension between Flemish and Walloon communities defines Belgian politics."}], "tags": ["Belgium", "Dutch", "Flanders", "Art"], "bbox": "2.5,50.5,6,51.5"}]}, {"id": "uscanada", "name": "US & Canada", "emoji": "🗽", "desc": "Cities, parks, geology, islands", "topics": [{"title": "New Orleans", "facts": [{"l": "Key Fact", "t": "Louisiana city known for Cajun/Creole cuisine, Mardi Gras, and being the birthplace of jazz."}, {"l": "Geography", "t": "Largely below sea level between the Mississippi River and Lake Pontchartrain. Hurricane Katrina (2005) caused catastrophic flooding."}, {"l": "Culture", "t": "The French Quarter (Vieux Carre) is its most famous neighborhood."}], "tags": ["Louisiana", "Jazz", "Mardi Gras", "Cajun"], "bbox": "-90.2,29.9,89.9,30.1"}, {"title": "Baffin Island", "facts": [{"l": "Key Fact", "t": "Largest island in Canada and fifth-largest in the world, part of Nunavut territory. Mostly above the Arctic Circle."}, {"l": "Geography", "t": "Iqaluit, Nunavut's capital, is on its southeastern coast. Features dramatic fjords, ice caps, and tundra."}, {"l": "History", "t": "Named after English navigator William Baffin (1616). Home to Inuit peoples for thousands of years."}], "tags": ["Canada", "Arctic", "Nunavut", "Fifth-Largest"], "bbox": "-80,62,-60,73"}, {"title": "California Tectonics", "facts": [{"l": "Key Fact", "t": "The San Andreas Fault — a transform boundary — is moving Los Angeles toward San Francisco at ~46 mm per year."}, {"l": "Science", "t": "At that rate, the cities will be side-by-side in about 15 million years. The 1906 SF earthquake came from this plate motion."}, {"l": "Geology", "t": "A transform boundary means the plates slide horizontally — causing strike-slip earthquakes."}], "tags": ["Tectonics", "California", "San Andreas", "Earthquakes"], "bbox": "-123,33,-115,39"}, {"title": "Great Lakes", "facts": [{"l": "Key Fact", "t": "Five lakes: Superior, Michigan, Huron, Erie, Ontario. HOMES mnemonic. Lake Superior is the largest freshwater lake on Earth by surface area."}, {"l": "Geography", "t": "Together hold ~20% of Earth's surface fresh water. Lake Michigan is the only one entirely within the US."}, {"l": "Economy", "t": "The St. Lawrence Seaway connects them to the Atlantic Ocean."}], "mnem": "🧠 HOMES: Huron, Ontario, Michigan, Erie, Superior. Superior is the biggest!", "tags": ["Lakes", "US-Canada", "Fresh Water", "HOMES"], "bbox": "-92,41,-76,49"}, {"title": "Rocky Mountains", "facts": [{"l": "Key Fact", "t": "Longest mountain system in North America: 4,800 km from British Columbia to New Mexico."}, {"l": "Science", "t": "The Continental Divide runs along the Rockies — west flows to the Pacific; east flows to the Gulf/Atlantic."}, {"l": "Parks", "t": "Yellowstone, Grand Teton, Glacier, and Rocky Mountain National Parks are all in the Rockies."}], "tags": ["Mountains", "Continental Divide", "North America"], "bbox": "-117,35,-105,55"}, {"title": "Newfoundland & Labrador", "facts": [{"l": "Key Fact", "t": "Canada's easternmost province: an island (Newfoundland) plus mainland Labrador. Joined Canada in 1949."}, {"l": "History", "t": "L'Anse aux Meadows on Newfoundland's northern tip is the only confirmed Norse (Viking) settlement in North America, ~1000 AD."}, {"l": "Time", "t": "Newfoundland Standard Time is UTC -3:30 — a rare half-hour offset from Atlantic Time."}], "tags": ["Canada", "Province", "Vikings", "Half-Hour Time Zone"], "bbox": "-60,46,-52,52"}, {"title": "Death Valley", "facts": [{"l": "Key Fact", "t": "Death Valley NP in California recorded 134 degrees F (56.7 C) on July 10, 1913 — the world's highest reliably measured air temperature."}, {"l": "Geography", "t": "Badwater Basin (282 ft below sea level) is the lowest point in North America. Just 84 miles from Mount Whitney."}, {"l": "Features", "t": "Famous for salt flats, colorful badlands, sand dunes, and 'sailing stones' that glide across the playa."}], "tags": ["California", "Hottest", "Lowest", "National Park"], "bbox": "-117.6,35.8,-116.2,37"}, {"title": "Cape Cod & Martha's Vineyard", "facts": [{"l": "Key Fact", "t": "Cape Cod is a hook-shaped glacial peninsula in Massachusetts. Martha's Vineyard is the island just to its south."}, {"l": "History", "t": "The Pilgrims landed on Cape Cod in 1620 before sailing to Plymouth. The Cape Cod Canal separates it from the mainland."}, {"l": "Culture", "t": "Martha's Vineyard is a popular summer destination. Nantucket island lies further to the east."}], "tags": ["Massachusetts", "Peninsula", "Island", "Glacial"], "bbox": "-71,41.2,-69.5,42.2"}, {"title": "Charleston, SC", "facts": [{"l": "Key Fact", "t": "Largest city in South Carolina, located on a harbor where the Ashley and Cooper Rivers meet."}, {"l": "History", "t": "Fort Sumter in Charleston Harbor was where the first shots of the American Civil War were fired (April 12, 1861)."}, {"l": "Culture", "t": "Known for antebellum architecture, cobblestone streets, and Lowcountry cuisine: she-crab soup, shrimp and grits."}], "tags": ["South Carolina", "Civil War", "Fort Sumter", "Lowcountry"], "bbox": "-80.1,32.7,-79.8,32.85"}, {"title": "Bryce Canyon", "facts": [{"l": "Key Fact", "t": "Utah national park with the highest concentration of hoodoos (thin rock spires) on Earth. Not actually a canyon — series of natural amphitheaters."}, {"l": "Science", "t": "Hoodoos form by frost wedging: water freezes in cracks, expands, and slowly pries rock apart over thousands of years."}, {"l": "Geology", "t": "Sits on the edge of the Paunsaugunt Plateau; colorful sedimentary rocks from ancient lake and river environments."}], "tags": ["Utah", "Hoodoos", "National Park", "Erosion"], "bbox": "-112.3,37.4,-112,37.7"}, {"title": "Arizona & Phoenix", "facts": [{"l": "Key Fact", "t": "Phoenix is Arizona's capital and the 5th-largest US city. Located in the Valley of the Sun in the Sonoran Desert."}, {"l": "Geography", "t": "The Salt and Gila Rivers meet near Phoenix. Arizona contains the Grand Canyon — carved by the Colorado River."}, {"l": "Culture", "t": "Arizona and Hawaii are the only US states that don't observe Daylight Saving Time."}], "tags": ["Southwest", "Grand Canyon", "No DST", "Sonoran Desert"], "bbox": "-114,31,-109,37"}, {"title": "Olympic Peninsula", "facts": [{"l": "Key Fact", "t": "In northwestern Washington State, bounded by the Pacific Ocean, Strait of Juan de Fuca, and Puget Sound."}, {"l": "Geography", "t": "The Hoh Rain Forest receives ~140 inches of rain annually — one of the wettest spots in the contiguous US."}, {"l": "Ecology", "t": "Geographic isolation produced species found nowhere else: the Olympic marmot and Olympic mudminnow."}], "tags": ["Washington", "Rain Forest", "Olympic NP", "Isolation"], "bbox": "-125,47,-122,48.5"}, {"title": "Oahu", "facts": [{"l": "Key Fact", "t": "Third-largest Hawaiian island but home to ~70% of the state's population. Honolulu, Hawaii's capital, is here."}, {"l": "History", "t": "Japan's surprise attack on Pearl Harbor (Dec 7, 1941) brought the US into WWII."}, {"l": "Landmarks", "t": "Diamond Head is an iconic extinct volcanic tuff cone overlooking Waikiki Beach."}], "tags": ["Hawaii", "Pearl Harbor", "Honolulu", "Diamond Head"], "bbox": "-158.3,21.2,-157.6,21.7"}, {"title": "Apostle Islands", "facts": [{"l": "Key Fact", "t": "22 islands in Lake Superior off northern Wisconsin — a National Lakeshore. Jesuit missionaries miscounted (name implies 12)."}, {"l": "Features", "t": "Famous for sandstone sea caves, historic lighthouses, and ice caves when Lake Superior freezes."}, {"l": "Location", "t": "Located off the tip of the Bayfield Peninsula in Wisconsin."}], "tags": ["Wisconsin", "Lake Superior", "Sea Caves", "22 Islands"], "bbox": "-91,46.7,-90,47.1"}, {"title": "Arkansas", "facts": [{"l": "Key Fact", "t": "Southern US state. Capital: Little Rock. Bentonville, AR is home to Walmart HQ — world's largest company by revenue."}, {"l": "Attractions", "t": "Crater of Diamonds State Park is the only publicly accessible diamond mine in the US."}, {"l": "History", "t": "The Little Rock Nine (1957) integrated Central High School under federal military escort — a defining Civil Rights moment."}], "tags": ["South", "Walmart", "Diamonds", "Civil Rights"], "bbox": "-94.5,33,-89.5,36.5"}, {"title": "Hollywood", "facts": [{"l": "Key Fact", "t": "A neighborhood of Los Angeles and the historic center of the American film industry. The Hollywood Sign originally read 'Hollywoodland' (1923 real estate ad)."}, {"l": "Culture", "t": "The Walk of Fame has 2,700+ stars. Major studios — Paramount, Warner Bros., Universal — have roots here."}, {"l": "Note", "t": "Hollywood is also the name of a city in Florida (near Fort Lauderdale), which can cause confusion."}], "tags": ["Los Angeles", "Film", "California"], "bbox": "-118.4,34,-118.2,34.15"}, {"title": "Mystic, Connecticut", "facts": [{"l": "Key Fact", "t": "A village in southeastern Connecticut known for Mystic Seaport — one of the world's largest maritime museums."}, {"l": "History", "t": "A major 19th-century shipbuilding center. The 1988 film 'Mystic Pizza' (Julia Roberts) was set here."}, {"l": "Context", "t": "The Connecticut River — longest named for a New England state — flows through the broader state."}], "tags": ["Connecticut", "Maritime", "Seaport", "New England"], "bbox": "-72.1,41.3,-71.9,41.4"}]}, {"id": "latam", "name": "Latin America & Caribbean", "emoji": "🌎", "desc": "Glaciers, lakes, capitals, islands", "topics": [{"title": "Honduras & Tegucigalpa", "facts": [{"l": "Key Fact", "t": "Honduras borders Guatemala (west), El Salvador (southwest), and Nicaragua (east). Capital: Tegucigalpa."}, {"l": "History", "t": "The ancient Maya city of Copan in western Honduras is famous for its carved stelae and Hieroglyphic Stairway."}, {"l": "Geography", "t": "Honduras has a long Caribbean coast. The Bay Islands are a world-class diving destination."}], "tags": ["Central America", "Maya", "Copan"], "bbox": "-89.5,13,-83,16"}, {"title": "Perito Moreno Glacier", "facts": [{"l": "Key Fact", "t": "In Los Glaciares National Park, Patagonia, Argentina. One of the world's few glaciers still actively advancing."}, {"l": "Geography", "t": "~30 km long; ice walls rise 70 m above Lake Argentino. Part of the Southern Patagonian Ice Field."}, {"l": "Event", "t": "Periodically the glacier dams a section of Lake Argentino; ice wall eventually spectacularly collapses."}], "tags": ["Glacier", "Argentina", "Patagonia", "Advancing"], "bbox": "-73.5,-50.8,-72.5,-50"}, {"title": "Lake Titicaca", "facts": [{"l": "Key Fact", "t": "South America's largest lake by surface area. Straddles Peru and Bolivia in the Andes at ~3,810 m — world's highest navigable lake."}, {"l": "Culture", "t": "The Uros people live on floating islands woven from totora reeds. In Inca myth, god Viracocha emerged from the lake."}, {"l": "Isla del Sol", "t": "The Island of the Sun on the Bolivian side was sacred to the Incas."}], "mnem": "🧠 TitiCACA — Peru + Bolivia. Highest navigable lake. Viracocha creation myth.", "tags": ["Lake", "Peru", "Bolivia", "Inca", "Highest Navigable"], "bbox": "-70.5,-16.5,-68.5,-15"}, {"title": "Cuba & Havana", "facts": [{"l": "Key Fact", "t": "Cuba is the Caribbean's largest island. Capital: Havana, known for colonial architecture, vintage American cars, and vibrant music."}, {"l": "Politics", "t": "Communist rule since Fidel Castro's 1959 revolution. US trade embargo largely remains."}, {"l": "Geography", "t": "Cuba is ~90 miles from Key West, Florida."}], "tags": ["Caribbean", "Communist", "Havana", "Largest Island"], "bbox": "-85,19.5,-74,23.5"}, {"title": "Saint Kitts and Nevis", "facts": [{"l": "Key Fact", "t": "Smallest sovereign state in the Americas by area and population — a two-island nation in the eastern Caribbean."}, {"l": "History", "t": "St. Kitts was the first Caribbean island colonized by the British (1623). Brimstone Hill Fortress is a UNESCO World Heritage Site."}, {"l": "Economy", "t": "Home to one of the world's oldest citizenship-by-investment programs."}], "tags": ["Caribbean", "Smallest", "British Colony", "UNESCO"], "bbox": "-62.9,17,-62.4,17.5"}, {"title": "Paseo de la Reforma", "facts": [{"l": "Key Fact", "t": "Mexico City's grand boulevard, commissioned by Emperor Maximilian I in the 1860s and modeled on Paris's Champs-Elysees."}, {"l": "Landmarks", "t": "Home to the Angel of Independence (El Angel), one of Mexico City's most recognizable monuments. Near Chapultepec Castle."}, {"l": "Today", "t": "Mexico City's financial corridor, lined with skyscrapers, embassies, and cultural institutions."}], "tags": ["Mexico City", "Boulevard", "Angel of Independence"], "bbox": "-99.22,19.42,-99.14,19.46"}]}, {"id": "terms", "name": "Key Terms", "emoji": "📚", "desc": "Vocabulary you must know cold", "topics": [{"title": "Geyser", "facts": [{"l": "Definition", "t": "A hot spring that periodically erupts, shooting hot water and steam skyward. Heated by underground magma."}, {"l": "Origin", "t": "English word 'geyser' derives from Iceland's 'Geysir.' Old Faithful (Yellowstone) is the world's most famous."}, {"l": "Science", "t": "Only ~1,000 worldwide. Found mostly in five countries: US, Iceland, New Zealand, Chile, Russia."}], "tags": ["Geology", "Hydrothermal"]}, {"title": "Escarpment", "facts": [{"l": "Definition", "t": "A steep slope or cliff separating two flat areas at different elevations, formed by tectonic faulting or differential erosion."}, {"l": "Examples", "t": "Niagara Escarpment (NY to Ontario); Great Escarpment (southern Africa)."}, {"l": "Formation", "t": "Hard rock remains while soft rock erodes away, leaving a steep face."}], "tags": ["Geology", "Landform"]}, {"title": "Estuary", "facts": [{"l": "Definition", "t": "A partially enclosed coastal body of water where river freshwater mixes with ocean saltwater."}, {"l": "Significance", "t": "Among the most biologically productive ecosystems — fish nurseries, pollution filters, storm buffers."}, {"l": "Examples", "t": "Chesapeake Bay (largest US estuary); Thames Estuary (England)."}], "tags": ["Water", "Ecology", "Coastal"]}, {"title": "Conflict Minerals", "facts": [{"l": "Definition", "t": "Natural resources mined in conflict zones and sold to fund armed groups — primarily tin, tantalum, tungsten, and gold ('3TG')."}, {"l": "Where", "t": "Most strongly associated with eastern Democratic Republic of the Congo."}, {"l": "Impact", "t": "Found in nearly all electronics (phones, laptops, consoles). International law requires supply-chain tracing."}], "tags": ["DRC", "Resources", "Ethics", "3TG"]}, {"title": "Black Sand Beaches", "facts": [{"l": "Definition", "t": "Beaches formed when lava rapidly cools on contact with ocean water, shattering basalt into dark grains."}, {"l": "Examples", "t": "Vik (Iceland), Punaluu (Hawaii), Santorini beaches (Greece), Canary Islands."}, {"l": "Science", "t": "Dark sand absorbs more heat than white sand. Rarer volcanic beaches: green (olivine) and red (iron-rich cinder)."}], "tags": ["Geology", "Volcanic", "Coastal"]}]}];

const SZ=25;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function samp(a,n){return shuffle(a).slice(0,n);}
let S={tab:'learn',rgn:null,xtrm:null,sq:[],si:0,sa:null,ss:0,st:0,sh:[],cq:[],ci:0,cr:false,cs:0,ct:0,ch:[],bq:[],bi:0,bc:0,bp:'w',bt:null,bl:100,bs:0,btot:0,bh:[]};
function nSQ(){S.sq=samp(ALL_S,SZ);S.si=0;S.sa=null;S.ss=0;S.st=0;S.sh=[];}
function nCQ(){S.cq=samp(ALL_C,SZ);S.ci=0;S.cr=false;S.cs=0;S.ct=0;S.ch=[];}
function nBQ(){clearInterval(S.bt);S.bq=samp(ALL_C,SZ);S.bi=0;S.bc=0;S.bp='w';S.bl=100;S.bs=0;S.btot=0;S.bh=[];}
nSQ();nCQ();nBQ();
document.getElementById('tabNav').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  const t=e.target.dataset.tab;S.tab=t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  render();
});
function render(){
  const m=document.getElementById('main');
  if(S.tab==='learn')m.innerHTML=rLearn();
  else if(S.tab==='simple')m.innerHTML=rSimple();
  else if(S.tab==='complex')m.innerHTML=rComplex();
  else m.innerHTML=rBuzzer();
  attach();
}
function rLearn(){
  let h=`<h2 class="st">Study Topics</h2><p class="ss">Select a region to explore. Each topic has key facts, memory tricks, and an interactive map.</p><div class="rg">`;
  for(const r of REGIONS) h+=`<div class="rc ${S.rgn===r.id?'on':''}" data-r="${r.id}"><span class="em">${r.emoji}</span><h3>${r.name}</h3><p>${r.desc}</p></div>`;
  h+=`</div>`;
  if(S.rgn){
    const R=REGIONS.find(r=>r.id===S.rgn);
    if(R.id==='terms'){
      h+=`<div class="tb"><h2>📚 Key Geographic Terms</h2>`;
      for(const t of R.topics){
        const ex=S.xtrm===t.title;
        h+=`<div class="cp ${ex?'on':''}" data-trm="${t.title}"><strong>${t.title}</strong>`;
        if(ex){h+=`<div class="cd">`;for(const f of t.facts)h+=`<strong>${f.l}:</strong> ${f.t}<br><br>`;if(t.tags)h+=`<div class="tgs">${t.tags.map(x=>`<span class="tg">${x}</span>`).join('')}</div>`;h+=`</div>`;}
        h+=`</div>`;
      }
      h+=`</div>`;
    } else {
      for(const t of R.topics){
        h+=`<div class="tb"><h2>${t.title}</h2>`;
        if(t.bbox){const[x1,y1,x2,y2]=t.bbox.split(',');h+=`<iframe class="me" src="https://www.openstreetmap.org/export/embed.html?bbox=${x1},${y1},${x2},${y2}&layer=mapnik" loading="lazy"></iframe><p class="mc2">Map: OpenStreetMap contributors</p>`;}
        for(const f of t.facts) h+=`<div class="fc"><h4>${f.l}</h4><p>${f.t}</p></div>`;
        if(t.mnem) h+=`<div class="fc"><div class="mn">${t.mnem}</div></div>`;
        if(t.tags) h+=`<div class="tgs">${t.tags.map(x=>`<span class="tg">${x}</span>`).join('')}</div>`;
        h+=`</div>`;
      }
    }
  }
  return h;
}
function rSimple(){
  if(S.si>=S.sq.length) return rDone('simple');
  const q=S.sq[S.si],an=S.sa;
  let h=`<h2 class="st">Quick-Fire Quiz</h2><p class="ss">Multiple choice — random 25 from a <span class="bj">${ALL_S.length}-question bank</span></p>`;
  h+=dots(S.sh,S.si,S.sq.length)+sbar(S.ss,S.st);
  h+=`<div class="qb"><div class="qn">Question ${S.si+1} of ${S.sq.length}</div><div class="qt">${q.q}</div><ul class="ol">`;
  q.o.forEach((o,i)=>{
    let c='';if(an!==null){c='di';if(i===q.a)c+=' rv';else if(i===an&&i!==q.a)c+=' ng';}
    h+=`<li class="${c}" data-o="${i}">${o}</li>`;
  });
  h+=`</ul>`;
  if(an!==null) h+=`<div class="ex">${q.e}</div><div style="margin-top:1rem;text-align:right;"><button class="btn bp" data-a="sn">${S.si<S.sq.length-1?'Next &rarr;':'Results'}</button></div>`;
  h+=`</div>`;return h;
}
function rComplex(){
  if(S.ci>=S.cq.length) return rDone('complex');
  const q=S.cq[S.ci];
  let h=`<h2 class="st">Bee-Style Questions</h2><p class="ss">Paragraph-style multi-clue questions — random 25 from a <span class="bj">${ALL_C.length}-question bank</span></p>`;
  h+=dots(S.ch,S.ci,S.cq.length)+sbar(S.cs,S.ct);
  h+=`<div class="qb"><div class="qn">Question ${S.ci+1} of ${S.cq.length}</div><div class="qt">${q.q}</div>`;
  if(!S.cr){
    h+=`<div class="ai"><input id="cxi" type="text" placeholder="Type your answer..." autocomplete="off"/><button class="btn bg" data-a="cx">Submit</button></div>`;
    h+=`<div style="margin-top:.6rem;text-align:center;"><button class="btn bo" data-a="cr" style="font-size:.8rem;">Show Answer</button></div>`;
  } else {
    const ok=S.ch[S.ch.length-1];
    h+=`<div class="rm ${ok?'ok':'ng'}">${ok?'✓ Correct!':'✗ Not quite.'} Answer: <strong>${q.a}</strong></div>`;
    h+=`<div style="margin-top:1rem;text-align:right;"><button class="btn bp" data-a="cn">${S.ci<S.cq.length-1?'Next &rarr;':'Results'}</button></div>`;
  }
  h+=`</div>`;return h;
}
function rBuzzer(){
  if(S.bi>=S.bq.length) return rDone('buzzer');
  const q=S.bq[S.bi];
  let h=`<h2 class="st">Buzzer Round</h2><p class="ss">Clues reveal one at a time. Buzz early for more points. Space = buzz. Random 25 from <span class="bj">${ALL_C.length}-question bank</span></p>`;
  h+=dots(S.bh,S.bi,S.bq.length)+sbar(S.bs,S.btot);
  h+=`<div class="bz">`;
  const pct=S.bl,col=pct>60?'g':pct>30?'y':'r';
  h+=`<div class="tb2"><div class="f ${col}" style="width:${pct}%" id="tf"></div></div>`;
  h+=`<div class="bc">`;
  if(S.bp==='w') h+=`<p style="text-align:center;color:var(--mt);padding:1rem 0;">Press Start to begin.</p>`;
  else for(let i=0;i<=S.bc&&i<q.c.length;i++) h+=`<p style="margin-bottom:.6rem;">${q.c[i]}</p>`;
  h+=`</div>`;
  if(S.bp==='w') h+=`<button class="btn bg" data-a="bs" style="font-size:1rem;padding:.8rem 2rem;">Start Question</button>`;
  else if(S.bp==='r') h+=`<button class="bb" data-a="bb">BUZZ!</button><p style="margin-top:.8rem;font-size:.8rem;color:var(--mt);">Press Space or click to buzz in</p>`;
  else if(S.bp==='d'){
