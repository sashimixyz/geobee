    h+=`<div class="ai"><input id="bzi" type="text" placeholder="Your answer..." autocomplete="off"/><button class="btn bg" data-a="bx">Submit</button></div>`;
    h+=`<p style="margin-top:.5rem;font-size:.8rem;color:var(--mt);">Buzzed at clue ${S.bc+1} of ${q.c.length}</p>`;
  } else {
    const ok=S.bh[S.bh.length-1],pts=ok?(q.c.length-S.bc)*2:0;
    h+=`<div class="rm ${ok?'ok':'ng'}">${ok?`✓ Correct! +${pts} pts (clue ${S.bc+1}/${q.c.length})`:`✗ Wrong. Answer: ${q.a}`}</div>`;
    if(!ok){h+=`<div style="margin-top:1rem;text-align:left;font-size:.85rem;color:var(--mt);">`;for(const c of q.c)h+=`<p style="margin-bottom:.4rem;">${c}</p>`;h+=`</div>`;}
    h+=`<div style="margin-top:1rem;"><button class="btn bp" data-a="bn">${S.bi<S.bq.length-1?'Next &rarr;':'Results'}</button></div>`;
  }
  h+=`</div>`;return h;
}
function dots(hist,cur,tot){let h=`<div class="ds">`;for(let i=0;i<tot;i++){let c='d';if(i<hist.length)c+=hist[i]?' ok':' ng';else if(i===cur)c+=' cu';h+=`<div class="${c}"></div>`;}return h+`</div>`;}
function sbar(s,t){return `<div class="sb"><span class="s1">Score: ${s}</span><span class="s2">${t} answered</span></div>`;}
function rDone(tp){
  const lbl={simple:'Quick-Fire Quiz',complex:'Bee-Style Questions',buzzer:'Buzzer Round'};
  const s=tp==='simple'?S.ss:tp==='complex'?S.cs:S.bs;
  const t=tp==='simple'?S.st:tp==='complex'?S.ct:S.btot;
  const msg=t===0?'Complete!':(s/t>=.8)?'Outstanding — you are ready!':s/t>=.6?'Good work — review your misses.':'Keep studying — you will get there!';
  return `<div class="bz" style="text-align:center;padding:2.5rem;"><h2 style="font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--navy);margin-bottom:.5rem;">${lbl[tp]}</h2><p style="font-size:2.5rem;font-weight:700;color:var(--gold);margin:1rem 0;">${s}${tp==='buzzer'?' pts':' / '+t}</p><p style="color:var(--mt);margin-bottom:1.5rem;">${msg}</p><button class="btn bg" data-a="r${tp}">New Random ${SZ}</button></div>`;
}
function chk(u,c){
  const n=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  const uu=n(u),cc=n(c);
  if(uu===cc||cc.includes(uu)&&uu.length>3||uu.includes(cc))return true;
  const st=s=>s.replace(/^(the |mount |lake |river |strait of |gulf of |cape )/i,'');
  if(st(uu)===st(cc))return true;
  const cw=cc.split(' ').filter(x=>x.length>2),uw=uu.split(' ').filter(x=>x.length>2);
  return cw.filter(x=>uw.includes(x)).length>=Math.max(1,Math.ceil(cw.length*.55));
}
function attach(){
  document.querySelectorAll('.rc').forEach(c=>c.addEventListener('click',()=>{
    S.rgn=S.rgn===c.dataset.r?null:c.dataset.r;S.xtrm=null;render();
  }));
  document.querySelectorAll('.cp').forEach(c=>c.addEventListener('click',()=>{
    S.xtrm=S.xtrm===c.dataset.trm?null:c.dataset.trm;render();
  }));
  document.querySelectorAll('.ol li:not(.di)').forEach(li=>li.addEventListener('click',()=>{
    if(S.sa!==null)return;
    const i=parseInt(li.dataset.o),q=S.sq[S.si],ok=i===q.a;
    S.sa=i;if(ok)S.ss++;S.st++;S.sh.push(ok);render();
  }));
  document.querySelector('[data-a="sn"]')?.addEventListener('click',()=>{S.si++;S.sa=null;render();});
  const cxs=()=>{const v=document.getElementById('cxi')?.value?.trim();if(!v)return;const q=S.cq[S.ci],ok=chk(v,q.a);S.cr=true;S.ct++;if(ok)S.cs++;S.ch.push(ok);render();};
  document.querySelector('[data-a="cx"]')?.addEventListener('click',cxs);
  document.getElementById('cxi')?.addEventListener('keydown',e=>{if(e.key==='Enter')cxs();});
  document.querySelector('[data-a="cr"]')?.addEventListener('click',()=>{S.cr=true;S.ct++;S.ch.push(false);render();});
  document.querySelector('[data-a="cn"]')?.addEventListener('click',()=>{S.ci++;S.cr=false;render();});
  document.querySelector('[data-a="bs"]')?.addEventListener('click',startBz);
  document.querySelector('[data-a="bb"]')?.addEventListener('click',buzzIn);
  const bxs=()=>{const v=document.getElementById('bzi')?.value?.trim();if(!v)return;const q=S.bq[S.bi],ok=chk(v,q.a);S.bp='a';S.btot++;if(ok)S.bs+=(q.c.length-S.bc)*2;S.bh.push(ok);render();};
  document.querySelector('[data-a="bx"]')?.addEventListener('click',bxs);
  document.getElementById('bzi')?.addEventListener('keydown',e=>{if(e.key==='Enter')bxs();});
  document.querySelector('[data-a="bn"]')?.addEventListener('click',()=>{S.bi++;S.bc=0;S.bp='w';S.bl=100;clearInterval(S.bt);render();});
  document.querySelector('[data-a="rsimple"]')?.addEventListener('click',()=>{nSQ();render();});
  document.querySelector('[data-a="rcomplex"]')?.addEventListener('click',()=>{nCQ();render();});
  document.querySelector('[data-a="rbuzzer"]')?.addEventListener('click',()=>{nBQ();render();});
  setTimeout(()=>{document.getElementById('cxi')?.focus();document.getElementById('bzi')?.focus();},60);
}
function startBz(){
  S.bp='r';S.bc=0;S.bl=100;clearInterval(S.bt);
  const q=S.bq[S.bi],tot=q.c.length,mpc=4500;
  let el=0;render();
  S.bt=setInterval(()=>{
    el+=100;S.bl=Math.max(0,100-(el/(tot*mpc))*100);
    const nc=Math.min(Math.floor(el/mpc),tot-1);
    const f=document.getElementById('tf');
    if(f){f.style.width=S.bl+'%';f.className='f '+(S.bl>60?'g':S.bl>30?'y':'r');}
    if(nc!==S.bc){S.bc=nc;render();}
    if(el>=tot*mpc+3000){clearInterval(S.bt);S.bp='a';S.btot++;S.bh.push(false);render();}
  },100);
}
function buzzIn(){if(S.bp!=='r')return;clearInterval(S.bt);S.bp='d';render();}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&S.tab==='buzzer'&&S.bp==='r'){e.preventDefault();buzzIn();}});
render();

</script>
