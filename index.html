<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAC Geography Bee Prep — Red Set 2026-27</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0f2b3c;--teal:#1a4a5e;--tl:#2a6a82;--gold:#e8a838;--gd:#c4882a;--sand:#f5efe6;--sd:#e8dfd2;--gr:#2d8f5e;--gl:#d4eddf;--red:#c0392b;--rl:#f8d7da;--tx:#1a1a1a;--mt:#5a6a72;--wh:#fff;--r:10px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sand);color:var(--tx);line-height:1.6;min-height:100vh}
.hd{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
.hd::before{content:'';position:absolute;top:-30%;left:-10%;width:120%;height:160%;background:radial-gradient(ellipse at 20% 80%,rgba(232,168,56,.12),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(42,106,130,.2),transparent 50%);pointer-events:none}
.hd h1{font-family:'DM Serif Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:400;position:relative;letter-spacing:-.02em}
.hd h1 span{color:var(--gold)}
.hd p{font-size:.9rem;opacity:.75;margin-top:.3rem;position:relative}
.tabs{display:flex;background:var(--navy);position:sticky;top:0;z-index:100;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:1;min-width:max-content;padding:.8rem 1rem;border:none;background:transparent;color:rgba(255,255,255,.55);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.tabs button:hover{color:rgba(255,255,255,.8)}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(232,168,56,.08)}
.mc{max-width:860px;margin:0 auto;padding:1.5rem}
.st{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--navy);margin-bottom:.3rem}
.ss{color:var(--mt);font-size:.92rem;margin-bottom:1.5rem;line-height:1.5}
.bj{font-size:.74rem;background:rgba(232,168,56,.15);color:var(--gd);padding:.2rem .6rem;border-radius:99px;font-weight:600}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-bottom:2rem}
.rc{background:#fff;border-radius:var(--r);padding:1.3rem;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
.rc:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(15,43,60,.1)}
.rc.on{border-color:var(--gold);box-shadow:0 4px 16px rgba(232,168,56,.15)}
.rc .em{font-size:1.8rem;margin-bottom:.5rem;display:block}
.rc h3{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:.25rem}
.rc p{font-size:.8rem;color:var(--mt)}
.tb{background:#fff;border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem}
.tb h2{font-family:'DM Serif Display',serif;font-size:1.35rem;color:var(--navy);margin-bottom:1rem}
.fc{background:var(--sand);border-radius:8px;padding:1rem 1.2rem;margin-bottom:.8rem;border-left:4px solid var(--gold)}
.fc h4{font-size:.85rem;font-weight:700;color:var(--teal);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.03em}
.fc p{font-size:.92rem;line-height:1.55}
.mn{margin-top:.5rem;padding:.5rem .7rem;background:rgba(232,168,56,.1);border-radius:6px;font-size:.82rem;color:var(--gd);font-weight:600}
.me{width:100%;height:255px;border-radius:8px;border:1px solid var(--sd);margin:.8rem 0}
.mc2{font-size:.72rem;color:var(--mt);margin-top:.2rem}
.tgs{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.tg{font-size:.72rem;padding:.2rem .6rem;border-radius:99px;background:var(--teal);color:#fff;font-weight:500}
.qb{background:#fff;border-radius:var(--r);padding:1.5rem;margin-bottom:1.2rem}
.qb .qn{font-size:.78rem;font-weight:700;color:var(--tl);margin-bottom:.5rem}
.qb .qt{font-size:1rem;line-height:1.6;margin-bottom:1rem;color:var(--navy);font-weight:500}
.ol{list-style:none}
.ol li{padding:.7rem 1rem;margin-bottom:.5rem;border-radius:8px;border:2px solid var(--sd);cursor:pointer;font-size:.92rem;transition:all .15s}
.ol li:hover:not(.di){border-color:var(--tl);background:rgba(26,74,94,.04)}
.ol li.ok{border-color:var(--gr);background:var(--gl)}
.ol li.ng{border-color:var(--red);background:var(--rl)}
.ol li.di{cursor:default;opacity:.7}
.ol li.di.rv{opacity:1;border-color:var(--gr);background:var(--gl)}
.ex{margin-top:.8rem;padding:.8rem 1rem;background:var(--sand);border-radius:8px;font-size:.88rem;line-height:1.5;color:var(--mt)}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.3rem;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s}
.bp{background:var(--teal);color:#fff}.bp:hover{background:var(--navy)}
.bg{background:var(--gold);color:var(--navy)}.bg:hover{background:var(--gd);color:#fff}
.bo{background:transparent;border:2px solid var(--teal);color:var(--teal)}.bo:hover{background:var(--teal);color:#fff}
.sb{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.2rem;background:#fff;border-radius:var(--r);margin-bottom:1.2rem}
.sb .s1{font-weight:700;color:var(--navy);font-size:1rem}
.sb .s2{font-size:.82rem;color:var(--mt)}
.ds{display:flex;gap:.35rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.ds .d{width:10px;height:10px;border-radius:50%;background:var(--sd)}
.ds .d.ok{background:var(--gr)}.ds .d.ng{background:var(--red)}.ds .d.cu{background:var(--gold);box-shadow:0 0 0 3px rgba(232,168,56,.3)}
.bz{background:#fff;border-radius:var(--r);padding:2rem;text-align:center}
.bc{font-size:1.05rem;line-height:1.7;color:var(--navy);min-height:120px;text-align:left;margin-bottom:1.5rem;font-weight:500}
.tb2{height:6px;background:var(--sd);border-radius:3px;margin-bottom:1rem;overflow:hidden}
.tb2 .f{height:100%;border-radius:3px;transition:width .3s linear}
.tb2 .f.g{background:var(--gr)}.tb2 .f.y{background:var(--gold)}.tb2 .f.r{background:var(--red)}
.bb{width:120px;height:120px;border-radius:50%;border:4px solid var(--red);background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 4px 15px rgba(192,57,43,.3);transition:transform .1s,box-shadow .1s}
.bb:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(192,57,43,.4)}
.bb:active{transform:scale(.95)}
.ai{display:flex;gap:.5rem;margin-top:1rem;max-width:420px;margin-left:auto;margin-right:auto}
.ai input{flex:1;padding:.7rem 1rem;border:2px solid var(--sd);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none}
.ai input:focus{border-color:var(--teal)}
.rm{margin-top:1rem;padding:.8rem 1rem;border-radius:8px;font-weight:600;font-size:.95rem}
.rm.ok{background:var(--gl);color:var(--gr)}.rm.ng{background:var(--rl);color:var(--red)}
.cp{background:#fff;padding:.6rem .8rem;border-radius:8px;font-size:.85rem;font-weight:500;cursor:pointer;border:2px solid transparent;transition:all .15s;margin-bottom:.5rem}
.cp:hover{border-color:var(--gold)}.cp.on{border-color:var(--teal);background:var(--sand)}
.cd{margin-top:.5rem;font-size:.84rem;font-weight:400;color:var(--mt);line-height:1.5}
@media(max-width:600px){.mc{padding:1rem}.rg{grid-template-columns:1fr}.tabs button{font-size:.75rem;padding:.7rem .6rem}.bz{padding:1.2rem}.bb{width:90px;height:90px;font-size:.85rem}}
</style>
</head>

<script>
const ALL_S=[{"q": "What is Africa's third-longest river, after the Nile and the Congo?", "o": ["Zambezi", "Orange", "Niger", "Limpopo"], "a": 2, "e": "The Niger flows through Guinea, Mali, Niger, and Nigeria, sharing its name with two countries."}, {"q": "Which country shares its name with Africa's third-longest river?", "o": ["Only Nigeria", "Only Niger", "Both Niger and Nigeria", "Neither"], "a": 2, "e": "The Niger River names both the country Niger and Nigeria, which it flows through or borders."}, {"q": "Near which ancient city does the Niger River form one of Africa's largest inland wetland deltas?", "o": ["Khartoum", "Dakar", "Timbuktu", "Cairo"], "a": 2, "e": "The Niger's Inner Delta near Timbuktu in Mali is a vast seasonal wetland, historically near the gold-salt trade hub."}, {"q": "In which country is Mount Kilimanjaro located?", "o": ["Kenya", "Ethiopia", "Uganda", "Tanzania"], "a": 3, "e": "Kilimanjaro is in Tanzania, near the Kenyan border, at 5,895 m — Africa's highest peak."}, {"q": "How many volcanic cones does Kilimanjaro have?", "o": ["One", "Two", "Three", "Five"], "a": 2, "e": "Kibo (highest), Mawenzi, and Shira are Kilimanjaro's three cones."}, {"q": "The people who traditionally farm coffee and bananas on Kilimanjaro's lower slopes are the:", "o": ["Maasai", "Kikuyu", "Chagga", "Swahili"], "a": 2, "e": "The Chagga people have inhabited Kilimanjaro's fertile slopes for centuries."}, {"q": "Somalia is located in which part of Africa?", "o": ["West Africa", "Central Africa", "Horn of Africa", "Southern Africa"], "a": 2, "e": "Somalia occupies the Horn of Africa — the continent's easternmost point, east of Ethiopia."}, {"q": "What is the capital of Somalia?", "o": ["Hargeisa", "Kismaayo", "Berbera", "Mogadishu"], "a": 3, "e": "Mogadishu is Somalia's capital and largest city."}, {"q": "Which militant group based in Somalia carried out the 2013 Westgate Mall attack in Nairobi?", "o": ["Boko Haram", "AQIM", "Al-Shabaab", "Ansar Dine"], "a": 2, "e": "Al-Shabaab, based in Somalia, carried out the Nairobi mall attack and many other attacks."}, {"q": "Lake Turkana is primarily located in which country?", "o": ["Ethiopia", "Uganda", "Kenya", "Tanzania"], "a": 2, "e": "Lake Turkana lies mostly in northern Kenya's Great Rift Valley, extending slightly into Ethiopia."}, {"q": "Lake Turkana was formerly known as:", "o": ["Lake Albert", "Lake Rudolf", "Lake Victoria", "Lake Edward"], "a": 1, "e": "It was called Lake Rudolf by European explorers; renamed after Kenyan independence."}, {"q": "What type of lake is Lake Turkana — the world's largest of its kind?", "o": ["Glacial lake", "Freshwater lake", "Permanent desert lake", "Crater lake"], "a": 2, "e": "Lake Turkana is the world's largest permanent desert lake and the world's largest alkaline lake."}, {"q": "What does the Arabic word 'Sahel' mean?", "o": ["Desert", "Shore", "Belt", "Grassland"], "a": 1, "e": "'Sahel' means 'shore' in Arabic — metaphorically, the shore of the Sahara."}, {"q": "The Sahel region is a transition zone between the Sahara Desert and which ecosystem to its south?", "o": ["Tropical rainforest", "Tundra", "Desert", "Savanna"], "a": 3, "e": "The Sahel transitions from the Sahara (north) to wetter savanna and grasslands to the south."}, {"q": "Which of these countries is part of the Sahel?", "o": ["Morocco", "Algeria", "Mali", "South Africa"], "a": 2, "e": "Mali lies in the heart of the Sahel, which also covers Niger, Burkina Faso, Chad, and others."}, {"q": "The Congo Rainforest is the world's second-largest tropical rainforest. What is the largest?", "o": ["Borneo", "Southeast Asian", "Congo Basin", "Amazon"], "a": 3, "e": "The Amazon Rainforest in South America is the world's largest; the Congo is second."}, {"q": "Which great ape, closely related to chimpanzees, is found ONLY in the Congo Basin?", "o": ["Gorilla", "Orangutan", "Bonobo", "Gibbon"], "a": 2, "e": "Bonobos (Pan paniscus) are found only in the DRC's Congo Basin."}, {"q": "Which conflict mineral mined in the DRC is used in phone capacitors?", "o": ["Silicon", "Aluminum", "Coltan (tantalum)", "Copper"], "a": 2, "e": "Coltan contains tantalum — a key conflict mineral found in eastern DRC and used in electronics."}, {"q": "Somalia's coastline faces which two bodies of water?", "o": ["Atlantic and Indian Oceans", "Indian Ocean and Gulf of Aden", "Red Sea and Persian Gulf", "Mediterranean and Red Sea"], "a": 1, "e": "Somalia's coastline faces the Indian Ocean (south/east) and the Gulf of Aden (north)."}, {"q": "Kilimanjaro is classified as which type of volcano?", "o": ["Active shield volcano", "Dormant stratovolcano", "Extinct caldera", "Active stratovolcano"], "a": 1, "e": "Kilimanjaro is a dormant stratovolcano — not erupting, but not fully extinct either."}, {"q": "What is the capital of the Philippines?", "o": ["Cebu", "Davao", "Manila", "Quezon City"], "a": 2, "e": "Manila is the Philippines' capital, on the island of Luzon."}, {"q": "Approximately how many islands make up the Philippines?", "o": ["Over 1,000", "Over 3,500", "Over 7,600", "Over 12,000"], "a": 2, "e": "The Philippines has over 7,600 islands."}, {"q": "What is the longest river in China and all of Asia?", "o": ["Yellow River", "Pearl River", "Mekong", "Yangtze"], "a": 3, "e": "The Yangtze (6,300 km) is Asia's longest river and China's longest."}, {"q": "The Three Gorges Dam on the Yangtze River is the world's:", "o": ["Longest dam", "Tallest dam", "Largest hydroelectric power station", "Oldest dam"], "a": 2, "e": "The Three Gorges Dam is the world's largest hydroelectric power station by installed capacity."}, {"q": "At which city does the Yangtze River empty into the East China Sea?", "o": ["Beijing", "Hong Kong", "Nanjing", "Shanghai"], "a": 3, "e": "Shanghai sits at the Yangtze's mouth on the East China Sea."}, {"q": "Bangkok sits within the delta of which river?", "o": ["Mekong", "Irrawaddy", "Salween", "Chao Phraya"], "a": 3, "e": "The Chao Phraya River flows through Bangkok and into the Gulf of Thailand."}, {"q": "Thailand was formerly known as:", "o": ["Burma", "Indochina", "Siam", "Kampuchea"], "a": 2, "e": "Thailand was called Siam; it was the only Southeast Asian country never colonized by Europeans."}, {"q": "Jerusalem is considered holy to how many major world religions?", "o": ["One", "Two", "Three", "Four"], "a": 2, "e": "Jerusalem is holy to Judaism, Christianity, and Islam."}, {"q": "The Western Wall in Jerusalem is the holiest accessible prayer site for which religion?", "o": ["Christianity", "Islam", "Judaism", "All three equally"], "a": 2, "e": "The Western Wall is the most sacred place where Jews may pray."}, {"q": "Jerusalem was originally the qibla (direction of prayer) for which religion?", "o": ["Judaism", "Christianity", "Islam", "Hinduism"], "a": 2, "e": "Early Muslims prayed toward Jerusalem before the direction was changed to Mecca."}, {"q": "Borneo is the world's third-largest island. What is the largest?", "o": ["Greenland", "New Guinea", "Sumatra", "Madagascar"], "a": 0, "e": "Greenland is the world's largest island. New Guinea is second; Borneo is third."}, {"q": "Indonesia's portion of Borneo is called:", "o": ["Sabah", "Sarawak", "Kalimantan", "Sulawesi"], "a": 2, "e": "Kalimantan is the Indonesian name for their roughly 73% share of Borneo."}, {"q": "Which tiny, oil-rich monarchy occupies the northern coast of Borneo?", "o": ["Singapore", "Timor-Leste", "Brunei", "Maldives"], "a": 2, "e": "Brunei, a wealthy absolute monarchy, sits on Borneo's northern coast."}, {"q": "The Hagia Sophia in Istanbul was originally built as a:", "o": ["Mosque", "Palace", "Christian cathedral", "Bazaar"], "a": 2, "e": "Built in 537 AD by Emperor Justinian as the world's largest Christian cathedral at that time."}, {"q": "What was Istanbul called when it was capital of the Byzantine Empire?", "o": ["Smyrna", "Ephesus", "Antioch", "Constantinople"], "a": 3, "e": "The city was Constantinople from 330 AD until the Ottoman conquest in 1453."}, {"q": "Istanbul is unique because it is the only major city located on:", "o": ["Two river deltas", "Two islands", "Two continents", "Two time zones"], "a": 2, "e": "Istanbul straddles the Bosporus, placing it on both European and Asian soil."}, {"q": "In which year was the Hagia Sophia reconverted from a museum to a mosque?", "o": ["2014", "2017", "2020", "2022"], "a": 2, "e": "Turkey's government reconverted the Hagia Sophia to a mosque in 2020, reversing a 1934 decision."}, {"q": "Osaka is the economic hub of which Japanese region?", "o": ["Kanto", "Kyushu", "Kansai", "Tohoku"], "a": 2, "e": "Osaka is the main economic hub of Japan's Kansai region."}, {"q": "Osaka Castle was originally built in 1583 by:", "o": ["Tokugawa Ieyasu", "Oda Nobunaga", "Toyotomi Hideyoshi", "Emperor Meiji"], "a": 2, "e": "Toyotomi Hideyoshi, a great unifier of Japan, commissioned Osaka Castle in 1583."}, {"q": "The Strait of Hormuz connects the Persian Gulf to which body of water?", "o": ["Red Sea", "Arabian Sea/Gulf of Oman", "Caspian Sea", "Bay of Bengal"], "a": 1, "e": "The Strait of Hormuz connects the Persian Gulf to the Gulf of Oman and then the Arabian Sea."}, {"q": "Approximately what share of global oil passes through the Strait of Hormuz daily?", "o": ["5%", "10%", "20-25%", "50%"], "a": 2, "e": "About one-fifth to one-quarter of all global oil transits the Strait of Hormuz daily."}, {"q": "The Strait of Hormuz is between Iran (north) and:", "o": ["UAE", "Qatar", "Oman", "Bahrain"], "a": 2, "e": "Oman's Musandam Peninsula forms the southern shore of the Strait of Hormuz."}, {"q": "Riyadh is the capital of which country?", "o": ["UAE", "Qatar", "Kuwait", "Saudi Arabia"], "a": 3, "e": "Riyadh is Saudi Arabia's capital and largest city, on the Najd plateau."}, {"q": "Saudi Arabia's economic diversification plan is called:", "o": ["Plan 2025", "Vision 2030", "Future 2040", "Reform 2050"], "a": 1, "e": "Vision 2030, launched by Crown Prince Mohammed bin Salman, aims to reduce Saudi Arabia's oil dependence."}, {"q": "The Khyber Pass connects Afghanistan to which country?", "o": ["India", "Iran", "Tajikistan", "Pakistan"], "a": 3, "e": "The Khyber Pass links Afghanistan to Pakistan through the Hindu Kush; Peshawar is at its eastern end."}, {"q": "The Khyber Pass was historically used as a route along which ancient trade network?", "o": ["Amber Road", "Incense Route", "Silk Road", "Spice Route"], "a": 2, "e": "The Silk Road used the Khyber Pass as a key overland connector between Central Asia and South Asia."}, {"q": "The Red River in Asia flows from China's Yunnan Province through which country?", "o": ["Thailand", "Cambodia", "Vietnam", "Laos"], "a": 2, "e": "The Red River (Song Hong) flows through northern Vietnam and its capital, Hanoi."}, {"q": "Which capital city sits on Asia's Red River?", "o": ["Ho Chi Minh City", "Vientiane", "Hanoi", "Phnom Penh"], "a": 2, "e": "Hanoi, Vietnam's capital, is situated on the Red River."}, {"q": "The Kowloon Walled City was located in which territory?", "o": ["Macau", "Singapore", "Hong Kong", "Taiwan"], "a": 2, "e": "Kowloon Walled City was in Kowloon, a part of Hong Kong."}, {"q": "What replaced the Kowloon Walled City after its 1993-94 demolition?", "o": ["A shopping mall", "A high-rise complex", "A park", "A government building"], "a": 2, "e": "Kowloon Walled City Park opened in 1995 on the site of the demolished settlement."}, {"q": "Kangchenjunga is the world's third-highest mountain. Which two are higher?", "o": ["Everest and K2", "Everest and Lhotse", "K2 and Lhotse", "Everest and Annapurna"], "a": 0, "e": "Everest (#1, 8,849 m) and K2 (#2, 8,611 m) rank above Kangchenjunga (8,586 m)."}, {"q": "Kangchenjunga sits on the border between Nepal and which Indian state?", "o": ["Darjeeling", "Assam", "Arunachal Pradesh", "Sikkim"], "a": 3, "e": "Kangchenjunga straddles the Nepal-Sikkim (India) border."}, {"q": "What does 'Kangchenjunga' translate to?", "o": ["King of Mountains", "Five Treasures of Snow", "Lord of the Peaks", "Sacred Cloud Summit"], "a": 1, "e": "The name means 'Five Treasures of Snow' in Tibetan, referring to its five summits."}, {"q": "Why do climbers traditionally stop just below Kangchenjunga's true summit?", "o": ["Weather too dangerous", "Ice too thin", "Government restriction", "Respect for local sacred traditions"], "a": 3, "e": "The Sikkimese consider Kangchenjunga sacred; climbers honor that by stopping a few meters below the top."}, {"q": "What is Japan's third-largest city and the economic hub of the Kansai region?", "o": ["Kyoto", "Kobe", "Osaka", "Nagoya"], "a": 2, "e": "Osaka is Japan's third-largest city and the dominant economic force in the Kansai region."}, {"q": "Which food is most famously associated with Osaka street-food culture?", "o": ["Sushi", "Ramen", "Takoyaki", "Tempura"], "a": 2, "e": "Takoyaki (octopus balls) is Osaka's most iconic street food."}, {"q": "Riyadh sits on which geographic feature in the interior of Saudi Arabia?", "o": ["Rub al-Khali", "Nejd/Najd plateau", "Hejaz mountains", "Arabian coastal plain"], "a": 1, "e": "Riyadh is built on the Najd plateau, an elevated interior region of the Arabian Peninsula."}, {"q": "Which Pakistani city sits at the eastern end of the Khyber Pass?", "o": ["Lahore", "Karachi", "Islamabad", "Peshawar"], "a": 3, "e": "Peshawar is the Pakistani city at the Khyber Pass's eastern mouth."}, {"q": "The Kowloon Walled City at its peak housed over 33,000 people in just:", "o": ["64 acres", "6.4 acres", "0.64 acres", "640 acres"], "a": 1, "e": "Over 33,000 residents in 6.4 acres made it the most densely populated place in history."}, {"q": "Borneo's rainforests are estimated to be approximately how old?", "o": ["10 million years", "65 million years", "130 million years", "200 million years"], "a": 2, "e": "Borneo's rainforests are roughly 130 million years old — among the oldest on Earth."}, {"q": "The Great Barrier Reef is the world's largest structure built by:", "o": ["Humans", "Volcanic activity", "Tectonic forces", "Living organisms (coral)"], "a": 3, "e": "Coral polyps — tiny living organisms — built the reef over millennia."}, {"q": "Off the coast of which Australian state is the Great Barrier Reef?", "o": ["New South Wales", "Western Australia", "Victoria", "Queensland"], "a": 3, "e": "The reef runs along Queensland's northeastern coast for about 2,300 km."}, {"q": "What is the main threat to the Great Barrier Reef?", "o": ["Overfishing", "Oil spills", "Rising ocean temperatures (coral bleaching)", "Invasive jellyfish"], "a": 2, "e": "Warmer water causes corals to expel their symbiotic algae — bleaching — which can kill them."}, {"q": "Antarctica holds approximately what percentage of Earth's fresh water?", "o": ["10%", "30%", "70%", "95%"], "a": 2, "e": "About 70% of Earth's fresh water is locked in Antarctica's ice sheet."}, {"q": "The Antarctic Treaty (1959) designates Antarctica for:", "o": ["Tourism only", "National territorial claims", "Peaceful scientific research", "Military exercises"], "a": 2, "e": "The treaty bans military activity and reserves Antarctica for peaceful scientific cooperation."}, {"q": "If Antarctica's ice sheet fully melted, sea levels would rise approximately:", "o": ["1 meter", "10 meters", "58 meters", "200 meters"], "a": 2, "e": "A complete melt of Antarctic ice would raise global sea levels roughly 58 meters."}, {"q": "The Treaty of Waitangi (1840) is the founding document of which country?", "o": ["Australia", "Fiji", "Samoa", "New Zealand"], "a": 3, "e": "Waitangi established British sovereignty while protecting Maori rights — New Zealand's founding document."}, {"q": "New Zealand's indigenous people, who arrived around 1300 AD, are called the:", "o": ["Aboriginal Australians", "Melanesians", "Maori", "Polynesian Samoans"], "a": 2, "e": "The Maori are New Zealand's indigenous Polynesian people."}, {"q": "Which mountain range runs along the length of New Zealand's South Island?", "o": ["Snowy Mountains", "Central Ranges", "Blue Mountains", "Southern Alps"], "a": 3, "e": "The Southern Alps form the spine of New Zealand's South Island."}, {"q": "McMurdo Station is operated by which country?", "o": ["Australia", "United Kingdom", "New Zealand", "United States"], "a": 3, "e": "McMurdo Station on Ross Island is operated by the United States Antarctic Program."}, {"q": "What is the nearest major city to McMurdo Station?", "o": ["Sydney", "Wellington", "Christchurch", "Hobart"], "a": 2, "e": "Christchurch, New Zealand serves as the primary gateway city for McMurdo, about 3,800 km away."}, {"q": "Micronesia is a subregion of which ocean?", "o": ["Atlantic", "Indian", "Southern", "Pacific"], "a": 3, "e": "Micronesia means 'small islands' and consists of thousands of islands in the western Pacific."}, {"q": "Which of these is a country within the Micronesian subregion?", "o": ["Vanuatu", "Tonga", "Palau", "Samoa"], "a": 2, "e": "Palau is in Micronesia. Others include Marshall Islands, FSM, Nauru, and Kiribati."}, {"q": "The Bosporus strait divides which country between two continents?", "o": ["Greece", "Russia", "Georgia", "Turkey"], "a": 3, "e": "The Bosporus splits Turkey between Europe (northwest) and Asia (southeast)."}, {"q": "What bodies of water does the Bosporus connect?", "o": ["Black Sea and Sea of Marmara", "Mediterranean and Black Sea", "Aegean and Adriatic", "Caspian and Black Sea"], "a": 0, "e": "The Bosporus links the Black Sea to the Sea of Marmara; the Dardanelles then leads to the Aegean."}, {"q": "The Danube is Europe's second-longest river. What is Europe's longest?", "o": ["Rhine", "Dnieper", "Elbe", "Volga"], "a": 3, "e": "The Volga (3,530 km) in Russia is Europe's longest river; the Danube is second."}, {"q": "How many countries does the Danube flow through or border — a world record?", "o": ["6", "8", "10", "14"], "a": 2, "e": "Ten countries share the Danube — more than any other river on Earth."}, {"q": "Which famous waltz was named after the Danube?", "o": ["The Blue Danube", "Voices of Spring", "Emperor Waltz", "Vienna Blood"], "a": 0, "e": "'The Blue Danube' by Johann Strauss II is the most famous Danube-related composition."}, {"q": "Which Danube capital is the farthest west?", "o": ["Belgrade", "Budapest", "Bratislava", "Vienna"], "a": 3, "e": "Vienna, Austria sits the farthest west of the Danube capitals. Then Bratislava, Budapest, Belgrade going east."}, {"q": "The Danube empties into which sea?", "o": ["Adriatic", "Mediterranean", "Caspian", "Black Sea"], "a": 3, "e": "The Danube reaches the Black Sea through a large delta in Romania."}, {"q": "Rome is built on how many hills?", "o": ["Five", "Six", "Seven", "Nine"], "a": 2, "e": "Rome was famously built on seven hills along the Tiber River."}, {"q": "Which tiny country is entirely enclosed within Rome?", "o": ["San Marino", "Andorra", "Monaco", "Vatican City"], "a": 3, "e": "Vatican City — the world's smallest country — is an enclave completely inside Rome."}, {"q": "The Colosseum in Rome held approximately how many spectators?", "o": ["10,000", "25,000", "50,000", "100,000"], "a": 2, "e": "The Colosseum (80 AD) seated about 50,000 spectators for gladiatorial contests."}, {"q": "Russia annexed Crimea from Ukraine in which year?", "o": ["2008", "2012", "2014", "2022"], "a": 2, "e": "Russia annexed Crimea in 2014, an internationally condemned move that preceded the 2022 invasion."}, {"q": "How many countries border the Black Sea?", "o": ["Four", "Five", "Six", "Eight"], "a": 2, "e": "Six countries: Turkey, Bulgaria, Romania, Ukraine, Russia, and Georgia."}, {"q": "Sicily is the largest island in which sea?", "o": ["Adriatic", "Tyrrhenian", "Ionian", "Mediterranean"], "a": 3, "e": "Sicily is the Mediterranean's largest island by area."}, {"q": "Which active volcano is located on Sicily?", "o": ["Vesuvius", "Stromboli", "Etna", "Vulcano"], "a": 2, "e": "Mount Etna on Sicily's eastern flank is Europe's tallest active volcano."}, {"q": "Sicily is separated from mainland Italy by:", "o": ["Strait of Otranto", "Strait of Messina", "Strait of Bonifacio", "Tyrrhenian Channel"], "a": 1, "e": "The Strait of Messina — only about 3 km at its narrowest — separates Sicily from Calabria."}, {"q": "The Iberian Peninsula is separated from Africa by the:", "o": ["Strait of Sicily", "Strait of Messina", "Strait of Otranto", "Strait of Gibraltar"], "a": 3, "e": "The Strait of Gibraltar — about 14 km wide — separates Spain/Portugal from Morocco."}, {"q": "Which mountain range separates the Iberian Peninsula from the rest of Europe?", "o": ["Alps", "Apennines", "Carpathians", "Pyrenees"], "a": 3, "e": "The Pyrenees form the natural border between Spain/Portugal and France."}, {"q": "Moorish rule in the Iberian Peninsula lasted approximately how long?", "o": ["200 years", "400 years", "800 years", "1,000 years"], "a": 2, "e": "Islamic Moorish rule in Iberia lasted roughly 800 years (711-1492 AD)."}, {"q": "Norway has Europe's longest coastline mainly because of its many:", "o": ["Beaches", "Fjords", "River deltas", "Lagoons"], "a": 1, "e": "Norway's countless glacially carved fjords give it an extraordinarily long and complex coastline."}, {"q": "Norwegian has two written standards. Which does the majority use?", "o": ["Nynorsk", "Riksmal", "Bokmal", "Landsmål"], "a": 2, "e": "Bokmal ('Book Tongue') is used by about 85-90% of Norwegians."}, {"q": "The Schengen Area is named after a town in which country?", "o": ["Belgium", "France", "Germany", "Luxembourg"], "a": 3, "e": "Schengen is a small town in Luxembourg where the 1985 agreement was signed."}, {"q": "How many countries are in the Schengen Area?", "o": ["15", "22", "29", "40"], "a": 2, "e": "As of 2024, 29 European countries are in the Schengen Area."}, {"q": "Which is TRUE about the Schengen Area?", "o": ["All EU members are in it", "All members are EU countries", "Non-EU countries like Norway are in it", "It was signed in 1995"], "a": 2, "e": "Non-EU nations including Norway, Iceland, Switzerland, and Liechtenstein are Schengen members."}, {"q": "Stromboli is nicknamed 'Lighthouse of the Mediterranean' because:", "o": ["It has a famous lighthouse", "Its eruptions glow at night", "It's the tallest island", "Ships calibrate GPS by it"], "a": 1, "e": "Stromboli has erupted nearly continuously for 2,000+ years; its glow helped ancient sailors navigate."}, {"q": "Naples is located near which volcano that destroyed Pompeii in 79 AD?", "o": ["Etna", "Vesuvius", "Stromboli", "Vulcano"], "a": 1, "e": "Mount Vesuvius erupted in 79 AD, burying Pompeii. It still looms over the Bay of Naples."}, {"q": "Which city is widely considered the birthplace of pizza?", "o": ["Rome", "Florence", "Venice", "Naples"], "a": 3, "e": "Naples is widely credited as the birthplace of pizza, particularly the Margherita style."}, {"q": "The Flemish people of Belgium speak which language?", "o": ["French", "Flemish (separate language)", "German", "Dutch"], "a": 3, "e": "Flemish is essentially Dutch — the Dutch dialect spoken in Belgium's northern Flanders region."}, {"q": "New Orleans is located in which US state?", "o": ["Mississippi", "Alabama", "Louisiana", "Georgia"], "a": 2, "e": "New Orleans is Louisiana's largest city, at the Mississippi River delta."}, {"q": "New Orleans is considered the birthplace of which music genre?", "o": ["Blues", "Country", "Hip-hop", "Jazz"], "a": 3, "e": "Jazz originated in New Orleans in the early 20th century."}, {"q": "Mardi Gras is celebrated as a pre-festival to which Christian season?", "o": ["Advent", "Lent", "Pentecost", "Easter Octave"], "a": 1, "e": "Mardi Gras (Fat Tuesday) is the last day of merrymaking before Lent, the 40-day fast before Easter."}, {"q": "Which 2005 hurricane devastated New Orleans when its levees failed?", "o": ["Rita", "Harvey", "Katrina", "Ida"], "a": 2, "e": "Hurricane Katrina (August 2005) caused catastrophic flooding when New Orleans' levees failed."}, {"q": "Baffin Island belongs to which Canadian territory?", "o": ["Northwest Territories", "Yukon", "Quebec", "Nunavut"], "a": 3, "e": "Baffin Island is part of Nunavut, Canada's newest and largest territory."}, {"q": "What is the capital of Nunavut, located on Baffin Island?", "o": ["Yellowknife", "Whitehorse", "Iqaluit", "Churchill"], "a": 2, "e": "Iqaluit, on Baffin Island's southeastern shore, is Nunavut's capital."}, {"q": "Baffin Island is named after which English navigator?", "o": ["John Davis", "Henry Hudson", "William Baffin", "Martin Frobisher"], "a": 2, "e": "William Baffin surveyed the island in 1616."}, {"q": "The San Andreas Fault is what type of tectonic plate boundary?", "o": ["Convergent", "Divergent", "Transform", "Subduction"], "a": 2, "e": "A transform boundary: plates slide horizontally past each other."}, {"q": "The San Andreas Fault is slowly moving Los Angeles and San Francisco:", "o": ["Further apart", "Toward each other", "Vertically", "In random directions"], "a": 1, "e": "The Pacific Plate moves northwest, closing the distance between LA and SF at about 46 mm per year."}, {"q": "Which mnemonic helps remember the five Great Lakes?", "o": ["GREAT", "LAKES", "HOMES", "HURON"], "a": 2, "e": "HOMES: Huron, Ontario, Michigan, Erie, Superior."}, {"q": "Which Great Lake is entirely within the United States?", "o": ["Huron", "Ontario", "Michigan", "Erie"], "a": 2, "e": "Lake Michigan is the only Great Lake that does not border Canada."}, {"q": "Together the Great Lakes hold approximately what share of Earth's surface fresh water?", "o": ["5%", "20%", "40%", "60%"], "a": 1, "e": "The Great Lakes contain about 20% of the world's surface fresh water."}, {"q": "The Rocky Mountains stretch from British Columbia, Canada south to:", "o": ["Texas", "California", "New Mexico", "Arizona"], "a": 2, "e": "The Rockies extend about 4,800 km from BC to New Mexico."}, {"q": "What geographic feature runs along the crest of the Rocky Mountains?", "o": ["Rain Shadow", "Continental Divide", "Pacific Ring", "Permafrost Zone"], "a": 1, "e": "The Continental Divide determines whether water drains to the Pacific or to the Gulf/Atlantic."}, {"q": "L'Anse aux Meadows in Newfoundland is the only confirmed site of what in North America?", "o": ["Pre-Columbian Spanish settlement", "A Viking/Norse settlement", "Ancient Chinese explorers", "An early French colony"], "a": 1, "e": "L'Anse aux Meadows is a ~1000 AD Norse settlement — the only confirmed Viking site in North America."}, {"q": "Newfoundland Standard Time differs from Atlantic Standard Time by:", "o": ["15 minutes", "30 minutes", "1 hour", "90 minutes"], "a": 1, "e": "Newfoundland is UTC -3:30, a rare 30-minute offset from Atlantic Standard Time (UTC -4)."}, {"q": "Death Valley's world-record high temperature was recorded in:", "o": ["1883", "1913", "1953", "1985"], "a": 1, "e": "134 degrees F (56.7 C) was recorded at Furnace Creek on July 10, 1913."}, {"q": "Badwater Basin in Death Valley is the lowest point in North America at:", "o": ["50 ft below sea level", "150 ft below sea level", "282 ft below sea level", "400 ft below sea level"], "a": 2, "e": "Badwater Basin sits 282 feet (86 m) below sea level."}, {"q": "Cape Cod is located in which US state?", "o": ["Connecticut", "Rhode Island", "New Hampshire", "Massachusetts"], "a": 3, "e": "Cape Cod is a glacially formed hook-shaped peninsula in southeastern Massachusetts."}, {"q": "Martha's Vineyard lies directly to the _____ of Cape Cod:", "o": ["North", "West", "South", "East"], "a": 2, "e": "Martha's Vineyard is an island just south of Cape Cod. Nantucket lies further east."}, {"q": "The Civil War's opening shots were fired at which site in Charleston harbor?", "o": ["Fort Moultrie", "Castle Pinckney", "Fort Johnson", "Fort Sumter"], "a": 3, "e": "Confederate forces opened fire on Fort Sumter on April 12, 1861, starting the Civil War."}, {"q": "Charleston is the largest city in which US state?", "o": ["North Carolina", "Georgia", "Virginia", "South Carolina"], "a": 3, "e": "Charleston is South Carolina's largest city by population."}, {"q": "Bryce Canyon National Park is located in which state?", "o": ["Arizona", "Colorado", "Nevada", "Utah"], "a": 3, "e": "Bryce Canyon is in southern Utah on the edge of the Paunsaugunt Plateau."}, {"q": "The tall, thin spire formations at Bryce Canyon are called:", "o": ["Mesas", "Buttes", "Hoodoos", "Arches"], "a": 2, "e": "Hoodoos are the narrow rock spires created by frost wedging at Bryce Canyon."}, {"q": "Phoenix is the capital of which state?", "o": ["New Mexico", "Nevada", "Utah", "Arizona"], "a": 3, "e": "Phoenix is Arizona's capital and the 5th-largest city in the US."}, {"q": "Which two US states do not observe Daylight Saving Time?", "o": ["Alaska and Hawaii", "Hawaii and Arizona", "Arizona and New Mexico", "California and Oregon"], "a": 1, "e": "Hawaii and Arizona (except the Navajo Nation) don't observe Daylight Saving Time."}, {"q": "The Olympic Peninsula is bounded by the Pacific Ocean, Puget Sound, and the:", "o": ["Columbia River", "Strait of Georgia", "Strait of Juan de Fuca", "Salish Sea"], "a": 2, "e": "The Strait of Juan de Fuca forms the Olympic Peninsula's northern boundary."}, {"q": "The Hoh Rain Forest on the Olympic Peninsula receives about how much rain annually?", "o": ["3 ft", "6 ft", "12 ft", "20 ft"], "a": 2, "e": "The Hoh Rain Forest gets about 140 inches (roughly 12 feet) of rain per year."}, {"q": "Oahu is home to approximately what percentage of Hawaii's population?", "o": ["30%", "50%", "70%", "90%"], "a": 2, "e": "About 70% of Hawaii's population lives on Oahu, making it by far the most populous island."}, {"q": "Which iconic Oahu landmark is an extinct volcanic tuff cone?", "o": ["Punchbowl", "Mauna Kea", "Haleakala", "Diamond Head"], "a": 3, "e": "Diamond Head rises above Waikiki and Honolulu; it's an extinct volcanic tuff cone."}, {"q": "The Apostle Islands are in which of the Great Lakes?", "o": ["Michigan", "Huron", "Erie", "Superior"], "a": 3, "e": "The Apostle Islands are in Lake Superior off the northern tip of Wisconsin."}, {"q": "How many islands are in the Apostle Islands?", "o": ["12", "17", "22", "30"], "a": 2, "e": "There are 22 Apostle Islands — Jesuit missionaries who named them apparently miscounted."}, {"q": "What is the capital of Arkansas?", "o": ["Fayetteville", "Fort Smith", "Jonesboro", "Little Rock"], "a": 3, "e": "Little Rock is Arkansas's capital and largest city."}, {"q": "Which retail giant is headquartered in Bentonville, Arkansas?", "o": ["Amazon", "Target", "Costco", "Walmart"], "a": 3, "e": "Walmart, the world's largest company by revenue, is headquartered in Bentonville, AR."}, {"q": "Crater of Diamonds State Park in Arkansas is unique because:", "o": ["It displays meteor craters", "It's the only publicly accessible diamond mine in the US", "It has the largest crater in North America", "Visitors study geology only"], "a": 1, "e": "The park lets visitors search for real diamonds and keep what they find."}, {"q": "The Hollywood Sign was originally erected in 1923 as an advertisement for:", "o": ["The film industry", "A national park", "A radio station", "A real estate development"], "a": 3, "e": "It originally read 'Hollywoodland' and advertised a housing development."}, {"q": "Mystic, Connecticut is known for which major institution?", "o": ["Ivy League university", "Mystic Seaport maritime museum", "Famous art museum", "Submarine base"], "a": 1, "e": "Mystic Seaport is one of the world's largest maritime history museums."}, {"q": "Baffin Island is the world's _____ largest island:", "o": ["Third", "Fourth", "Fifth", "Sixth"], "a": 2, "e": "Baffin Island is the fifth-largest island in the world."}, {"q": "Death Valley is only 84 miles from which peak — the highest in the contiguous US?", "o": ["Mount Rainier", "Mount Whitney", "Pikes Peak", "Mount Shasta"], "a": 1, "e": "Mount Whitney (14,505 ft) is only 84 miles from Badwater Basin, the lowest point in North America."}, {"q": "The St. Lawrence Seaway connects the Great Lakes to which ocean?", "o": ["Pacific", "Arctic", "Indian", "Atlantic"], "a": 3, "e": "The St. Lawrence Seaway provides ocean shipping access from the Atlantic into the Great Lakes."}, {"q": "Honduras borders all of the following EXCEPT:", "o": ["Guatemala", "El Salvador", "Costa Rica", "Nicaragua"], "a": 2, "e": "Honduras borders Guatemala, El Salvador, and Nicaragua. Costa Rica borders Nicaragua but not Honduras."}, {"q": "Which ancient Maya site in Honduras is known for its carved stelae and Hieroglyphic Stairway?", "o": ["Tikal", "Chichen Itza", "Uxmal", "Copan"], "a": 3, "e": "Copan in western Honduras is famous for its carved monuments and one of the longest Maya inscriptions."}, {"q": "The Perito Moreno Glacier is located in which Argentine region?", "o": ["Pampas", "Atacama", "Patagonia", "Gran Chaco"], "a": 2, "e": "Perito Moreno is in Los Glaciares National Park in Patagonia, southern Argentina."}, {"q": "Perito Moreno is unusual among glaciers because it is:", "o": ["The world's longest", "Still advancing (not retreating)", "Located in a tropical area", "Entirely underground"], "a": 1, "e": "While most glaciers retreat due to climate change, Perito Moreno is still advancing."}, {"q": "Lake Titicaca straddles the border between Peru and:", "o": ["Chile", "Ecuador", "Colombia", "Bolivia"], "a": 3, "e": "Lake Titicaca is shared by Peru and Bolivia, in the Andes at about 3,810 m above sea level."}, {"q": "The Uros people of Lake Titicaca live on floating islands made of:", "o": ["Bamboo", "Balsa wood", "Totora reeds", "Woven grass"], "a": 2, "e": "The Uros weave and live on floating islands built from totora reeds harvested from the lake."}, {"q": "In Inca mythology, which god emerged from Lake Titicaca to create the sun and moon?", "o": ["Inti", "Pachacamac", "Quetzalcoatl", "Viracocha"], "a": 3, "e": "Viracocha, the Inca creator god, was said to have risen from Lake Titicaca to create the cosmos."}, {"q": "Lake Titicaca is South America's largest lake by:", "o": ["Volume", "Depth", "Surface area", "Number of islands"], "a": 2, "e": "By surface area, Lake Titicaca is South America's largest lake."}, {"q": "Cuba is the largest island in the:", "o": ["Gulf of Mexico", "Atlantic Ocean", "Caribbean Sea", "Sargasso Sea"], "a": 2, "e": "Cuba is the Caribbean's largest island."}, {"q": "Cuba is approximately how far from Key West, Florida?", "o": ["30 miles", "60 miles", "90 miles", "150 miles"], "a": 2, "e": "Cuba is about 90 miles from Key West — the nearest point between Cuba and the US mainland."}, {"q": "Saint Kitts and Nevis is the smallest sovereign state in the Americas by:", "o": ["Population only", "Area only", "Both area and population", "Economic output"], "a": 2, "e": "Saint Kitts and Nevis is the smallest sovereign state in the Americas by both area and population."}, {"q": "The Paseo de la Reforma in Mexico City was modeled after which European boulevard?", "o": ["Las Ramblas, Barcelona", "Via Veneto, Rome", "Champs-Elysees, Paris", "Kurfurstendamm, Berlin"], "a": 2, "e": "Emperor Maximilian I commissioned the boulevard in the 1860s, inspired by Paris's Champs-Elysees."}, {"q": "Which famous monument stands on the Paseo de la Reforma?", "o": ["Aztec Sun Stone", "El Angel (Angel of Independence)", "Statue of Juarez", "Monument to the Revolution"], "a": 1, "e": "El Angel de la Independencia is one of Mexico City's most iconic landmarks, on the Paseo de la Reforma."}, {"q": "What is the capital of Honduras?", "o": ["San Pedro Sula", "Managua", "Tegucigalpa", "Guatemala City"], "a": 2, "e": "Tegucigalpa is Honduras's capital. Honduras borders El Salvador, Nicaragua, and Guatemala."}, {"q": "The Paseo de la Reforma was commissioned by:", "o": ["Benito Juarez", "Emperor Maximilian I", "Porfirio Diaz", "Vicente Fox"], "a": 1, "e": "Austrian-born Emperor Maximilian I commissioned it in the 1860s, modeled on Paris's boulevards."}, {"q": "Perito Moreno is part of which freshwater reserve — the world's third largest?", "o": ["Northern Patagonian Ice Field", "Southern Patagonian Ice Field", "Chilean Glaciers Reserve", "Andean Ice Cap"], "a": 1, "e": "Perito Moreno is part of the Southern Patagonian Ice Field — Earth's third-largest freshwater reserve."}, {"q": "Cuba has been under communist rule since Fidel Castro's revolution in:", "o": ["1948", "1953", "1959", "1965"], "a": 2, "e": "Fidel Castro's revolution succeeded in 1959; he ruled Cuba until 2008."}, {"q": "St. Kitts was the first Caribbean island colonized by which European power?", "o": ["Spanish", "French", "Dutch", "British"], "a": 3, "e": "The British established their first Caribbean colony on St. Kitts in 1623. The French soon followed."}, {"q": "Which Brimstone Hill site on St. Kitts is a UNESCO World Heritage Site?", "o": ["Brimstone Hill Fortress", "Brimstone Caves", "Brimstone Crater", "Brimstone Bay"], "a": 0, "e": "Brimstone Hill Fortress on St. Kitts was once called the 'Gibraltar of the West Indies.'"}, {"q": "Honduras has the ruins of which ancient Maya city in its western region?", "o": ["Tikal", "Palenque", "Copan", "Uxmal"], "a": 2, "e": "Copan in western Honduras features intricate carved stelae and the famous Hieroglyphic Stairway."}, {"q": "A geyser is a type of:", "o": ["Volcano", "Underground river", "Tidal pool", "Hot spring that periodically erupts"], "a": 3, "e": "A geyser is a hot spring that periodically erupts with water and steam, heated by underground magma."}, {"q": "The English word 'geyser' derives from which country's 'Geysir'?", "o": ["New Zealand", "Norway", "Iceland", "United States"], "a": 2, "e": "Iceland's Great Geysir gave the English language the word 'geyser.'"}, {"q": "Which US national park is most famous for geysers including Old Faithful?", "o": ["Grand Teton", "Crater Lake", "Yellowstone", "Grand Canyon"], "a": 2, "e": "Yellowstone National Park has the world's highest concentration of geysers."}, {"q": "An escarpment is:", "o": ["A type of river delta", "A type of sand dune", "A steep slope separating two flat areas at different elevations", "An underwater ridge"], "a": 2, "e": "An escarpment is a steep face formed by faulting or differential erosion between two elevation levels."}, {"q": "An estuary forms where:", "o": ["Two rivers meet", "A glacier reaches the sea", "River freshwater meets ocean saltwater", "Two ocean currents collide"], "a": 2, "e": "Estuaries are partially enclosed coastal waters where river flow mixes with tidal saltwater."}, {"q": "Why are estuaries considered biologically productive?", "o": ["They're very warm", "They're very deep", "They serve as fish nurseries and filter pollutants", "They have the most sunlight"], "a": 2, "e": "Estuaries nurture juvenile fish and shellfish, absorb pollutants, and buffer coasts from storm damage."}, {"q": "The Chesapeake Bay is the largest example of which coastal feature in the United States?", "o": ["Fjord", "Lagoon", "Estuary", "Gulf"], "a": 2, "e": "The Chesapeake Bay, formed by the drowned Susquehanna River valley, is the largest US estuary."}, {"q": "The '3TG' conflict minerals are tin, tantalum, tungsten, and:", "o": ["Titanium", "Tellurium", "Gold", "Thallium"], "a": 2, "e": "The 3TG group — tin, tantalum, tungsten, and gold — are most associated with conflict financing."}, {"q": "Black sand beaches are primarily formed from:", "o": ["Dark clay deposits", "Oil contamination", "Volcanic basalt fragments", "Compressed coal"], "a": 2, "e": "When lava meets ocean water, rapid cooling shatters basalt into fine dark sand."}, {"q": "Besides black, what other unusually colored volcanic sand beaches exist?", "o": ["Blue and purple", "Green (olivine) and red (iron cinder)", "Orange and gray", "Yellow and silver"], "a": 1, "e": "Green sand beaches form from olivine crystals; red sand beaches from iron-rich volcanic cinder — both extremely rare."}, {"q": "Which country has the most geysers in the world?", "o": ["Iceland", "New Zealand", "Chile", "United States"], "a": 3, "e": "Yellowstone National Park in the US has over 500 geysers — more than anywhere else on Earth."}, {"q": "The Niagara Escarpment runs from New York through which Canadian province?", "o": ["Quebec", "British Columbia", "Ontario", "Manitoba"], "a": 2, "e": "The Niagara Escarpment extends from New York state through Ontario, creating the Niagara Falls."}, {"q": "Conflict minerals are most strongly associated with which African country?", "o": ["Nigeria", "South Africa", "DRC (Congo)", "Zambia"], "a": 2, "e": "Eastern Democratic Republic of the Congo is the most notorious source of conflict minerals."}, {"q": "Black sand beaches absorb more heat than white sand beaches because:", "o": ["They're wetter", "Their dark color absorbs more solar radiation", "They're at lower elevation", "The sand is denser"], "a": 1, "e": "Dark colors absorb more solar radiation than light colors, so black sand gets much hotter."}, {"q": "A geyser erupts because:", "o": ["Tectonic plates shift", "Underground water heated by magma builds pressure", "Volcanic ash blocks vents", "Ocean tides push water up"], "a": 1, "e": "Underground water heated by nearby magma builds pressure until it explosively releases."}, {"q": "An escarpment can form by which two processes?", "o": ["Erosion and weathering", "Tectonic faulting and differential erosion", "River cutting and glaciation", "Wind erosion and volcanic activity"], "a": 1, "e": "Escarpments form when one block of crust drops (faulting) or when soft rock erodes away leaving a hard cliff."}, {"q": "Which is the largest estuary in the United States?", "o": ["San Francisco Bay", "Long Island Sound", "Puget Sound", "Chesapeake Bay"], "a": 3, "e": "The Chesapeake Bay, formed by the ancient Susquehanna River valley, is the largest US estuary."}, {"q": "Conflict minerals end up in everyday products like:", "o": ["Clothing and shoes", "Smartphones and laptops", "Paper and books", "Food and medicine"], "a": 1, "e": "Tin, tantalum, tungsten, and gold are found in virtually all modern electronics."}, {"q": "Iceland's Great Geysir gave English the word 'geyser.' In which language does 'geysir' mean 'to gush'?", "o": ["Danish", "Swedish", "Old Norse", "Finnish"], "a": 2, "e": "'Geysir' derives from the Old Norse verb 'gjosa,' meaning 'to gush.'"}, {"q": "Famous black sand beaches are found in Iceland's Vik and Hawaii's:", "o": ["Waimea Bay", "Punaluu Beach", "Hanauma Bay", "Lanikai Beach"], "a": 1, "e": "Punaluu Beach on Hawaii's Big Island is one of the world's most famous black sand beaches."}];
const ALL_C=[{"q": "This river flows in a distinctive boomerang curve through Guinea, Mali, and a landlocked country whose name it shares, before entering Africa's most populous country and emptying through a vast delta into the Gulf of Guinea. Its Inner Delta near an ancient city of Islamic scholarship creates one of Africa's largest wetlands. After the Nile and the Congo, it is Africa's third-longest river. Name it.", "a": "Niger River", "c": ["This African river flows in a boomerang curve through West Africa.", "Its Inner Delta near Timbuktu is one of Africa's largest seasonal wetlands.", "It shares its name with two countries: Niger and Nigeria.", "It is Africa's third-longest river, after the Nile and the Congo."]}, {"q": "This dormant stratovolcano rises above Tanzania with three cones — Kibo, Mawenzi, and Shira. The Chagga people farm coffee and bananas on its lower slopes, and its rapidly shrinking glaciers make climate change visible. It is the tallest free-standing mountain in the world and the highest peak on the African continent. Name it.", "a": "Mount Kilimanjaro", "c": ["This Tanzania volcano has three cones: Kibo, Mawenzi, and Shira.", "The Chagga people farm coffee on its lower slopes.", "Its glaciers are rapidly retreating due to climate change.", "It is the world's tallest free-standing mountain and Africa's highest peak."]}, {"q": "This nation in the Horn of Africa, east of Ethiopia, has Africa's longest mainland coastline along the Indian Ocean and Gulf of Aden. Al-Shabaab, a militant group based here, attacked a Nairobi shopping mall in 2013. Piracy from its coast became a global concern in the late 2000s. Name this country governed from Mogadishu.", "a": "Somalia", "c": ["It occupies the Horn of Africa, east of Ethiopia.", "Al-Shabaab militants are based here; they attacked a Nairobi mall in 2013.", "Piracy from this country's coast alarmed the world in the 2000s.", "Its capital is Mogadishu, and it has Africa's longest mainland coastline."]}, {"q": "This Kenyan lake in the Great Rift Valley is the world's largest permanent desert lake and the world's largest alkaline lake. Fossil discoveries on its shores revealed some of the oldest known human ancestors, earning it a nickname about humanity's origins. Its main inflow is the Omo River from Ethiopia, and it was formerly called Lake Rudolf. Name it.", "a": "Lake Turkana", "c": ["It lies in Kenya's Great Rift Valley — world's largest permanent desert lake.", "It is also the world's largest alkaline lake.", "Oldest known human ancestor fossils found on its shores.", "Formerly called Lake Rudolf; its main inflow is Ethiopia's Omo River."]}, {"q": "This semi-arid region stretches as a wide belt from Senegal in the west to Eritrea in the east, forming a transition zone between the Sahara Desert and the wetter savannas to the south. Its name is Arabic for 'shore.' Countries within it include Mali, Niger, Burkina Faso, and Chad, all of which face serious insurgencies. Name this drought-prone region.", "a": "Sahel", "c": ["This region forms a belt across Africa just south of the Sahara.", "Its name is Arabic for 'shore' — metaphorically, the shore of the Sahara.", "Countries in it include Mali, Niger, Burkina Faso, and Chad.", "It is a transition zone prone to drought and desertification."]}, {"q": "This is the world's second-largest tropical rainforest, spanning the Congo Basin across the Democratic Republic of the Congo, Republic of the Congo, Cameroon, and other countries. It shelters gorillas, forest elephants, bonobos, and okapis, and acts as a critical global carbon sink. Its eastern portion is notorious for mining conflict minerals — coltan, tin, and tungsten — that fund armed groups. Name these forests.", "a": "Congo Rainforest", "c": ["This is the world's second-largest tropical rainforest after the Amazon.", "It spans the Congo Basin, including the DRC, Republic of Congo, and Cameroon.", "It shelters gorillas, bonobos, forest elephants, and okapis.", "Its eastern DRC portion is a major conflict mineral mining zone."]}, {"q": "This river flows in a boomerang shape through West Africa, naming two countries along the way. Near the ancient trade city of Timbuktu, it fans into a massive inland delta — one of Africa's great wetland systems. It ranks third in Africa by length. Name it.", "a": "Niger River", "c": ["Forms a boomerang curve through West Africa.", "Passes through or names both Niger and Nigeria.", "The Inner Delta near Timbuktu is one of Africa's great wetlands.", "Third-longest river in Africa."]}, {"q": "This East African nation on the Horn of Africa has Al-Shabaab — a militant group — operating within its borders. Its capital is Mogadishu. It has the longest mainland coastline in Africa and experienced severe piracy problems in the late 2000s. Name it.", "a": "Somalia", "c": ["Occupies the Horn of Africa, east of Ethiopia.", "Al-Shabaab is a militant group operating here.", "Capital: Mogadishu.", "Longest mainland coastline in Africa; severe piracy in the late 2000s."]}, {"q": "This African lake, the world's largest alkaline lake and largest permanent desert lake, sits in Kenya's Great Rift Valley. Hominid fossils of extraordinary age found on its shores earned it the nickname 'Cradle of Mankind.' It was renamed after Kenyan independence, having formerly honored a Habsburg crown prince. Name it.", "a": "Lake Turkana", "c": ["Kenya's Great Rift Valley — world's largest permanent desert lake.", "Also the world's largest alkaline lake.", "Ancient hominid fossils found here — nicknamed 'Cradle of Mankind.'", "Formerly called Lake Rudolf after a Habsburg crown prince."]}, {"q": "This semi-arid African region, whose name derives from the Arabic word for 'shore,' stretches from Senegal to Eritrea just south of the Sahara. Countries such as Mali, Niger, and Chad lie within it. Repeated droughts and expanding desertification make life precarious for its inhabitants. Name it.", "a": "Sahel", "c": ["Semi-arid belt from Senegal to Eritrea, just south of the Sahara.", "Name from the Arabic word for 'shore.'", "Countries within it include Mali, Niger, and Chad.", "Droughts and desertification are constant threats."]}, {"q": "The world's second-largest tropical rainforest — after the Amazon — spans this central African basin. It shelters gorillas, bonobos, and okapis, and the DRC's eastern portion is a major source of conflict minerals including coltan. Name these forests.", "a": "Congo Rainforest", "c": ["World's second-largest tropical rainforest after the Amazon.", "Spans the Congo Basin in central Africa.", "Shelters gorillas, bonobos, and okapis.", "Eastern DRC: major source of conflict minerals including coltan."]}, {"q": "Over 7,600 islands form this Southeast Asian archipelago on the Pacific Ring of Fire. Its three main island groups — Luzon, Visayas, and Mindanao — are prone to typhoons, earthquakes, and volcanic eruptions. More than three centuries of Spanish colonization explain its many Spanish surnames and dominant Catholic faith. Name this country and its capital.", "a": "Philippines (capital: Manila)", "c": ["This Southeast Asian country has over 7,600 islands.", "It sits on the Pacific Ring of Fire: typhoons, quakes, and volcanoes are common.", "Over 300 years of Spanish rule shaped its culture and religion.", "Its capital is Manila, on the island of Luzon."]}, {"q": "This river originates on the Tibetan Plateau and flows 6,300 km eastward past Chongqing, Wuhan, and Nanjing before discharging into the East China Sea at the world's busiest container port. The world's largest hydroelectric dam was built across it in the early 2000s. It is Asia's longest river. Name it.", "a": "Yangtze River", "c": ["This river originates on the Tibetan Plateau and flows east across China.", "It passes Chongqing, Wuhan, and Nanjing before reaching the sea.", "The Three Gorges Dam — world's largest hydroelectric station — spans it.", "It is Asia's longest river, emptying at Shanghai."]}, {"q": "This city, the capital of Thailand, sits within the Chao Phraya River delta and earned the nickname 'Venice of the East' for its historic canal networks. The country it governs was the only Southeast Asian nation never colonized by a European power and was formerly called Siam. This city has the world's longest ceremonial place name. Name it.", "a": "Bangkok", "c": ["It sits in the Chao Phraya River delta in Southeast Asia.", "Its canal networks earned it the nickname 'Venice of the East.'", "Its country, formerly called Siam, was never colonized by Europeans.", "It has the world's longest official ceremonial city name."]}, {"q": "This ancient city is holy to three major world religions: Jews revere its Western Wall; Christians venerate the Church of the Holy Sepulchre; Muslims prize the Al-Aqsa Mosque and Dome of the Rock, and the city was Islam's original direction of prayer. Both Israel and Palestine claim it as their capital. Name it.", "a": "Jerusalem", "c": ["Holy to three religions: Judaism, Christianity, and Islam.", "Jews: Western Wall. Christians: Church of the Holy Sepulchre.", "Muslims: Al-Aqsa Mosque, Dome of the Rock — and it was Islam's first qibla.", "Both Israel and Palestine claim it as their capital."]}, {"q": "This island — the world's third-largest — is shared by Indonesia (which calls its roughly 73% portion Kalimantan), Malaysia (Sabah and Sarawak), and a tiny oil-rich absolute monarchy. Its rainforests are estimated at 130 million years old. Critically endangered orangutans live here. Name this island.", "a": "Borneo", "c": ["This is the world's third-largest island.", "Indonesia calls its 73% share Kalimantan; Malaysia and Brunei hold the north.", "Its rainforests are about 130 million years old — among Earth's oldest.", "Critically endangered orangutans are its most iconic residents."]}, {"q": "Originally built as a Christian cathedral in 537 AD, this Istanbul structure was converted to a mosque after the Ottoman conquest, made into a secular museum in 1934, and reconverted to a mosque in 2020. It sits in the world's only major city that straddles two continents. Name this architectural icon.", "a": "Hagia Sophia", "c": ["Built in 537 AD as a Christian cathedral by Emperor Justinian.", "Converted to a mosque after the Ottoman conquest of 1453.", "Made a secular museum in 1934; reconverted to a mosque in 2020.", "Located in Istanbul — the only major city on two continents."]}, {"q": "This narrow waterway running through Istanbul divides Turkey's European and Asian halves and connects the Black Sea to the Sea of Marmara. At its narrowest it is only about 700 meters wide, yet it controls Russia's naval access to the Mediterranean. Major empires have battled for control of it for millennia. Name it.", "a": "Bosporus", "c": ["This strait divides Turkey between Europe and Asia.", "It connects the Black Sea to the Sea of Marmara.", "At its narrowest, it is only about 700 meters wide.", "Russia's Black Sea fleet must pass through it to reach the Mediterranean."]}, {"q": "This waterway between Iran to the north and Oman to the south connects the Persian Gulf to the Gulf of Oman. Roughly 20-25% of the world's total oil supply passes through it daily, making it the globe's most critical energy chokepoint. Iran has repeatedly threatened to block it during international standoffs. Name it.", "a": "Strait of Hormuz", "c": ["This strait lies between Iran (north) and Oman (south).", "It connects the Persian Gulf to the Gulf of Oman and Arabian Sea.", "About 20-25% of the world's oil passes through it each day.", "Iran has threatened to close it — it is the world's most critical oil chokepoint."]}, {"q": "This mountain pass through the Hindu Kush has been used by conquerors for millennia — Alexander the Great, Mughal emperors, and British armies all marched through it. A critical overland Silk Road route, it links Afghanistan to Pakistan, with Peshawar at its eastern end. Name it.", "a": "Khyber Pass", "c": ["This mountain pass cuts through the Hindu Kush range.", "Alexander the Great and Mughal emperors used it.", "It was a critical Silk Road land route.", "It links Afghanistan to Pakistan; Peshawar is at its eastern end."]}, {"q": "This river flows from Yunnan Province, China through northern Vietnam to the Gulf of Tonkin. Its name comes from the reddish-brown silt it carries. Vietnam's capital Hanoi sits on its banks. Its delta is one of the most densely populated regions on Earth and has been central to Vietnamese civilization for thousands of years. Name it.", "a": "Red River (Asia)", "c": ["This river flows from Yunnan Province, China into northern Vietnam.", "It is named for its reddish-brown silt.", "Vietnam's capital Hanoi sits on its banks.", "Its delta is one of the most densely populated regions on Earth."]}, {"q": "This former Hong Kong settlement was at its peak the most densely populated place on Earth, with over 33,000 residents in just 6.4 acres. It existed in a legal gray zone — neither fully under British nor Chinese jurisdiction — allowing unlicensed clinics and businesses to thrive. It was demolished in 1993-94 and is now a park. Name it.", "a": "Kowloon Walled City", "c": ["Once the most densely populated place on Earth: 33,000+ people in 6.4 acres.", "Located in Hong Kong in a legal gray zone, outside both British and Chinese authority.", "Unlicensed doctors, dentists, and food stalls operated freely inside.", "Demolished 1993-94; now a public park."]}, {"q": "This mountain on the Nepal-Sikkim border is the world's third-highest at 8,586 meters. Its name means 'Five Treasures of Snow.' Local Sikkimese people regard it as sacred, and climbers traditionally stop just short of the true summit out of respect. Before 19th-century surveys, it was thought to be the world's tallest. Name it.", "a": "Kangchenjunga", "c": ["Third-highest mountain in the world at 8,586 meters.", "Located on the Nepal-Sikkim (India) border.", "Its name means 'Five Treasures of Snow' in Tibetan.", "Climbers traditionally stop short of the true summit out of respect for local beliefs."]}, {"q": "This city, the economic heart of Japan's Kansai region, was historically called the 'Nation's Kitchen' for its vibrant food culture. Its castle was built in 1583 by Toyotomi Hideyoshi. It hosted World Expo 2025 and is home to the Dotonbori entertainment strip. Name this Japanese city.", "a": "Osaka", "c": ["This is Japan's third-largest city and the Kansai region's economic hub.", "Historically nicknamed the 'Nation's Kitchen' for its food culture.", "Osaka Castle was built by Toyotomi Hideyoshi in 1583.", "It hosted World Expo 2025 and is known for Dotonbori street food."]}, {"q": "The capital of Saudi Arabia sits on the Najd plateau in the interior of the Arabian Peninsula. It has grown from a small walled settlement into a sprawling modern metropolis. Saudi Arabia's Vision 2030 economic diversification plan is centered here, and the Kingdom Centre Tower is its most iconic skyscraper. Name this city.", "a": "Riyadh", "c": ["Saudi Arabia's capital sits on the Najd plateau in the interior of the Arabian Peninsula.", "It grew from a small walled town into a modern metropolis.", "Vision 2030 — Saudi Arabia's economic diversification plan — is based here.", "The Kingdom Centre Tower is its most recognizable landmark."]}, {"q": "This ancient pass through the Hindu Kush has witnessed the armies of Alexander the Great, the Mughals, and the British Empire. It was a key overland artery of the Silk Road, linking Afghanistan to Pakistan. The city of Peshawar anchors its eastern end. Name it.", "a": "Khyber Pass", "c": ["Mountain pass through the Hindu Kush.", "Alexander the Great, the Mughals, and the British all used it.", "Key overland Silk Road artery.", "Peshawar is at its eastern end in Pakistan."]}, {"q": "This river — flowing from Yunnan Province, China into northern Vietnam — carries reddish-brown silt that gives it its name. Vietnam's capital Hanoi sits on its banks. Its delta, one of Earth's most densely populated regions, has sustained Vietnamese civilization for millennia. Name it.", "a": "Red River (Asia)", "c": ["Flows from Yunnan Province, China into northern Vietnam.", "Named for its reddish-brown silt.", "Hanoi, Vietnam's capital, sits on its banks.", "Its delta is one of the world's most densely populated regions."]}, {"q": "Once the most densely populated place on Earth — over 33,000 people in 6.4 acres — this Hong Kong settlement existed outside both British and Chinese authority. Unlicensed businesses and clinics operated freely within. Demolished 1993-94, it is now a tranquil park. Name it.", "a": "Kowloon Walled City", "c": ["Most densely populated place ever: 33,000+ people in 6.4 acres, in Hong Kong.", "Outside both British and Chinese legal authority.", "Unlicensed doctors, dentists, and businesses thrived inside.", "Demolished 1993-94 and replaced by a park."]}, {"q": "This strait, running through Istanbul, links the Black Sea to the Sea of Marmara and separates Turkey's European and Asian halves. At its narrowest it is only about 700 meters wide, yet it is one of the world's most strategically vital waterways. Name it.", "a": "Bosporus", "c": ["Divides European and Asian Turkey.", "Links the Black Sea to the Sea of Marmara.", "Only about 700 meters wide at its narrowest.", "Runs through Istanbul — world's only major intercontinental city."]}, {"q": "This body of water between Iran and Oman sees roughly one-fifth of all global oil flow through it daily, making any closure catastrophic to world energy markets. Iran has periodically threatened exactly that during tensions with Western nations. It connects the Persian Gulf to the Gulf of Oman. Name it.", "a": "Strait of Hormuz", "c": ["Between Iran and Oman.", "About 20% of global oil supply passes through it daily.", "Closure would be catastrophic to world energy markets.", "Connects the Persian Gulf to the Gulf of Oman."]}, {"q": "This Japanese city's street-food culture is centered on the Dotonbori district. Historically its merchants made it Japan's commercial capital, earning it the nickname 'Nation's Kitchen.' It is the Kansai region's dominant metropolis and hosted World Expo 2025. Name it.", "a": "Osaka", "c": ["Dotonbori is its famous street-food district.", "Historically called the 'Nation's Kitchen' — Japan's commercial capital.", "Dominant city of the Kansai region.", "Hosted World Expo 2025."]}, {"q": "This structure off the coast of Queensland, Australia is the world's largest built by living organisms. Stretching about 2,300 km and comprising nearly 3,000 individual reef systems, it supports over 1,500 fish species. Rising ocean temperatures have caused repeated bleaching events that threaten its survival. Name it.", "a": "Great Barrier Reef", "c": ["World's largest structure made by living organisms — coral polyps.", "Stretches about 2,300 km off Queensland, Australia.", "Comprises nearly 3,000 individual reef systems.", "Coral bleaching from rising ocean temperatures is its gravest threat."]}, {"q": "This continent holds about 70% of Earth's fresh water locked in ice. The Antarctic Treaty (1959) reserves it for peaceful scientific research, and no nation legally owns it. It is Earth's coldest, driest, and windiest continent. Name it.", "a": "Antarctica", "c": ["It holds about 70% of Earth's fresh water in its ice sheet.", "The 1959 Antarctic Treaty bans military activity and reserves it for science.", "No country owns it.", "It is the coldest, driest, and windiest continent on Earth."]}, {"q": "This country's founding document — the Treaty of Waitangi, signed in 1840 — established British sovereignty while protecting the rights of its indigenous people, the Maori, who arrived around 1300 AD. The South Island features the Southern Alps and numerous fjords. It is the southernmost country of Oceania. Name it.", "a": "New Zealand", "c": ["The Treaty of Waitangi (1840) is its founding document.", "The Maori, its indigenous people, arrived about 1300 AD.", "Its South Island has the Southern Alps and extensive fjords.", "It is the southernmost country of Oceania."]}, {"q": "This is the largest research station in Antarctica, operated by the United States on Ross Island. It can house over 1,000 scientists in summer and sits more than 3,800 km from its nearest major city — Christchurch, New Zealand. It serves as the logistical hub for US Antarctic scientific operations. Name it.", "a": "McMurdo Station", "c": ["Largest research station in Antarctica, run by the United States.", "Located on Ross Island.", "Houses over 1,000 researchers in summer.", "Its nearest major city is Christchurch, New Zealand — 3,800 km away."]}, {"q": "This Pacific subregion's name means 'small islands.' It includes Palau, the Marshall Islands, Guam, Kiribati, Nauru, and a federated state sharing its name. Most of its islands are low-lying coral atolls severely threatened by rising sea levels. Spain, Germany, Japan, and the United States have all ruled its islands at various times. Name it.", "a": "Micronesia", "c": ["Its name means 'small islands' in Greek.", "It is a subregion in the western Pacific.", "Includes Palau, Marshall Islands, Guam, Kiribati, and Nauru.", "Low-lying coral atolls here are threatened by sea-level rise."]}, {"q": "This treaty, signed in 1840 at a bay on New Zealand's North Island, established British sovereignty over the country while protecting the rights of its indigenous Maori people. It is New Zealand's founding document and the basis for modern Maori land rights claims. Name this treaty.", "a": "Treaty of Waitangi", "c": ["Signed in 1840 at a bay on New Zealand's North Island.", "Established British sovereignty over New Zealand.", "Protected the rights of the indigenous Maori people.", "New Zealand's founding document; basis for modern Maori land claims."]}, {"q": "This Antarctic station, the largest on the continent, is run by the United States on Ross Island. It can house over a thousand researchers in summer and serves as the logistics hub for US Antarctic science. Its nearest major city is Christchurch, New Zealand — 3,800 km away. Name it.", "a": "McMurdo Station", "c": ["Largest station in Antarctica.", "Run by the United States on Ross Island.", "Houses 1,000+ researchers in summer.", "Nearest major city: Christchurch, New Zealand, 3,800 km away."]}, {"q": "This Pacific subregion, whose name is Greek for 'small islands,' includes thousands of islands: Guam, Palau, Kiribati, Nauru, the Marshall Islands, and the Federated States sharing its name. Most are low-lying coral atolls existentially threatened by sea-level rise. Name this subregion.", "a": "Micronesia", "c": ["Greek for 'small islands.'", "Western Pacific subregion.", "Includes Guam, Palau, Kiribati, Nauru, and Marshall Islands.", "Low-lying coral atolls severely threatened by sea-level rise."]}, {"q": "This river flows through or borders ten countries — a world record for rivers — passing through capital cities including Vienna, Bratislava, Budapest, and Belgrade before emptying via a delta into the Black Sea in Romania. Johann Strauss II wrote a famous waltz about its color. It is Europe's second-longest river. Name it.", "a": "Danube River", "c": ["It flows through or borders more countries than any river on Earth: ten.", "Capital cities along it: Vienna, Bratislava, Budapest, and Belgrade.", "Strauss's famous waltz names its color.", "Europe's second-longest river; empties into the Black Sea in Romania."]}, {"q": "This Italian capital was traditionally built on seven hills along the Tiber River. Among its landmarks: a 1st-century amphitheater that once held 50,000 spectators, and an 18th-century fountain where tossing a coin is said to guarantee your return. The world's smallest country, entirely enclosed within this city's limits, is the seat of the Catholic Church. Name this capital.", "a": "Rome", "c": ["Built on seven hills along the Tiber River.", "The Colosseum held 50,000 spectators for gladiatorial games.", "Tossing a coin in the Trevi Fountain is said to guarantee your return.", "Vatican City — the world's smallest country — is enclosed entirely within it."]}, {"q": "This sea is bordered by Turkey, Bulgaria, Romania, Ukraine, Russia, and Georgia. A peninsula on its northern shore was annexed by Russia from Ukraine in 2014 — a move widely condemned internationally that foreshadowed Russia's 2022 full-scale invasion. Its deep waters are nearly devoid of oxygen, forming one of the world's largest anoxic zones. Name it.", "a": "Black Sea", "c": ["Bordered by Turkey, Bulgaria, Romania, Ukraine, Russia, and Georgia — six countries.", "Russia annexed a peninsula on its northern shore (Crimea) in 2014.", "This preceded Russia's 2022 full-scale invasion of Ukraine.", "Its deep waters are nearly devoid of oxygen — a massive anoxic zone."]}, {"q": "This island, the Mediterranean's largest, belongs to Italy and is separated from the mainland by a 3-km strait. Its eastern slopes host Europe's tallest active volcano. Successive rulers — Greeks, Romans, Arabs, Normans, and Spanish — each left cultural fingerprints on the island. Name it.", "a": "Sicily", "c": ["It is the Mediterranean's largest island.", "Separated from mainland Italy by the 3-km-wide Strait of Messina.", "Mount Etna — Europe's tallest active volcano — is on its eastern flank.", "Greeks, Romans, Arabs, Normans, and Spanish all ruled it successively."]}, {"q": "This westernmost peninsula of mainland Europe is home to two countries. The Pyrenees separate it from France to the northeast, and a narrow strait barely 14 km wide separates it from Africa to the south. Nearly 800 years of Moorish Islamic rule profoundly shaped its languages, architecture, and culture. Name this peninsula.", "a": "Iberian Peninsula", "c": ["Westernmost peninsula of mainland Europe.", "Home to Spain and Portugal.", "The Pyrenees separate it from France; a 14-km strait separates it from Africa.", "About 800 years of Moorish rule deeply shaped its culture."]}, {"q": "This medieval fortress, built around 1299 on a waterfront in Norway's capital, served at various times as a royal residence, military stronghold, and prison. Norway's many fjords give it Europe's longest coastline. This country's city of Bergen was the northernmost member of the Hanseatic League. Name this fortress and the city where it stands.", "a": "Akershus Fortress (in Oslo)", "c": ["Built around 1299 on the waterfront of Norway's capital.", "Served as a royal residence, military stronghold, and prison.", "Norway's fjords give it Europe's longest coastline.", "Bergen in the same country was the Hanseatic League's northernmost member."]}, {"q": "This travel zone of 29 European countries abolished internal passport controls under an agreement signed in 1985 in a small town in Luxembourg. It includes non-EU members like Norway and Switzerland but excludes some EU nations like Ireland. A single visa covers all member states. Name this area.", "a": "Schengen Area", "c": ["29 European countries abolished internal passport controls under this agreement.", "Signed in 1985 in a small Luxembourg town of the same name.", "Includes non-EU countries like Norway and Switzerland.", "A single visa covers travel across all member states."]}, {"q": "This volcanic island north of Sicily in the Aeolian Islands has erupted nearly continuously for over 2,000 years, earning the nickname 'Lighthouse of the Mediterranean.' Ancient sailors used its glow for navigation. Name this perpetually active Italian island.", "a": "Stromboli", "c": ["A volcanic island in the Aeolian Islands, north of Sicily.", "It has erupted nearly continuously for over 2,000 years.", "Known as the 'Lighthouse of the Mediterranean.'", "Ancient sailors used its nighttime glow for navigation."]}, {"q": "The Dutch-speaking population of northern Belgium — their region called Flanders — are known by this name. Despite their
