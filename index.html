<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAC Geography Bee Prep — Red Set 2026–27</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0f2b3c;
  --teal: #1a4a5e;
  --teal-light: #2a6a82;
  --gold: #e8a838;
  --gold-dim: #c4882a;
  --sand: #f5efe6;
  --sand-dark: #e8dfd2;
  --green: #2d8f5e;
  --green-light: #d4eddf;
  --red: #c0392b;
  --red-light: #f8d7da;
  --text: #1a1a1a;
  --text-muted: #5a6a72;
  --white: #ffffff;
  --radius: 10px;
}

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--sand);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* ─── Header ─── */
.site-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
  color: var(--white);
  padding: 2rem 1.5rem 1.5rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute;
  top: -30%; left: -10%;
  width: 120%; height: 160%;
  background: radial-gradient(ellipse at 20% 80%, rgba(232,168,56,0.12) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 20%, rgba(42,106,130,0.2) 0%, transparent 50%);
  pointer-events: none;
}
.site-header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 400;
  position: relative;
  letter-spacing: -0.02em;
}
.site-header h1 span { color: var(--gold); }
.site-header p {
  font-size: 0.9rem;
  opacity: 0.75;
  margin-top: 0.3rem;
  position: relative;
}

/* ─── Navigation ─── */
.tab-nav {
  display: flex;
  gap: 0;
  background: var(--navy);
  position: sticky;
  top: 0;
  z-index: 100;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-nav button {
  flex: 1;
  min-width: max-content;
  padding: 0.8rem 1rem;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.55);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.tab-nav button:hover { color: rgba(255,255,255,0.8); }
.tab-nav button.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
  background: rgba(232,168,56,0.08);
}

/* ─── Main content ─── */
.main-content { max-width: 860px; margin: 0 auto; padding: 1.5rem; }
.section-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.6rem;
  color: var(--navy);
  margin-bottom: 0.3rem;
}
.section-subtitle {
  color: var(--text-muted);
  font-size: 0.92rem;
  margin-bottom: 1.5rem;
  line-height: 1.5;
}

/* ─── Region cards (Learn tab) ─── */
.region-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}
.region-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 1.3rem;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  border: 2px solid transparent;
}
.region-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(15,43,60,0.1);
}
.region-card.active {
  border-color: var(--gold);
  box-shadow: 0 4px 16px rgba(232,168,56,0.15);
}
.region-card .emoji { font-size: 1.8rem; margin-bottom: 0.5rem; display: block; }
.region-card h3 { font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 0.25rem; }
.region-card p { font-size: 0.8rem; color: var(--text-muted); }

/* ─── Topic detail ─── */
.topic-detail {
  background: var(--white);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}
.topic-detail h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.35rem;
  color: var(--navy);
  margin-bottom: 1rem;
}
.fact-card {
  background: var(--sand);
  border-radius: 8px;
  padding: 1rem 1.2rem;
  margin-bottom: 0.8rem;
  border-left: 4px solid var(--gold);
}
.fact-card h4 {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--teal);
  margin-bottom: 0.3rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.fact-card p { font-size: 0.92rem; line-height: 1.55; }
.fact-card .mnemonic {
  margin-top: 0.5rem;
  padding: 0.5rem 0.7rem;
  background: rgba(232,168,56,0.1);
  border-radius: 6px;
  font-size: 0.82rem;
  color: var(--gold-dim);
  font-weight: 600;
}
.map-embed {
  width: 100%;
  height: 280px;
  border-radius: 8px;
  border: 1px solid var(--sand-dark);
  margin: 0.8rem 0;
}
.img-credit {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
}
.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-top: 0.6rem;
}
.tag {
  font-size: 0.72rem;
  padding: 0.2rem 0.6rem;
  border-radius: 99px;
  background: var(--teal);
  color: var(--white);
  font-weight: 500;
}

/* ─── Quiz styles ─── */
.quiz-container { max-width: 700px; margin: 0 auto; }
.question-box {
  background: var(--white);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.2rem;
}
.question-box .q-number {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--teal-light);
  margin-bottom: 0.5rem;
}
.question-box .q-text {
  font-size: 1rem;
  line-height: 1.6;
  margin-bottom: 1rem;
  color: var(--navy);
  font-weight: 500;
}
.options-list { list-style: none; }
.options-list li {
  padding: 0.7rem 1rem;
  margin-bottom: 0.5rem;
  border-radius: 8px;
  border: 2px solid var(--sand-dark);
  cursor: pointer;
  font-size: 0.92rem;
  transition: all 0.15s;
}
.options-list li:hover:not(.disabled) {
  border-color: var(--teal-light);
  background: rgba(26,74,94,0.04);
}
.options-list li.selected { border-color: var(--teal); background: rgba(26,74,94,0.06); }
.options-list li.correct { border-color: var(--green); background: var(--green-light); }
.options-list li.wrong { border-color: var(--red); background: var(--red-light); }
.options-list li.disabled { cursor: default; opacity: 0.7; }
.options-list li.disabled.answer-reveal { opacity: 1; border-color: var(--green); background: var(--green-light); }

.explanation {
  margin-top: 0.8rem;
  padding: 0.8rem 1rem;
  background: var(--sand);
  border-radius: 8px;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text-muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.65rem 1.3rem;
  border-radius: 8px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-primary { background: var(--teal); color: var(--white); }
.btn-primary:hover { background: var(--navy); }
.btn-gold { background: var(--gold); color: var(--navy); }
.btn-gold:hover { background: var(--gold-dim); color: var(--white); }
.btn-outline { background: transparent; border: 2px solid var(--teal); color: var(--teal); }
.btn-outline:hover { background: var(--teal); color: var(--white); }

.score-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 1.2rem;
  background: var(--white);
  border-radius: var(--radius);
  margin-bottom: 1.2rem;
}
.score-bar .score-text { font-weight: 700; color: var(--navy); font-size: 1rem; }
.score-bar .score-detail { font-size: 0.82rem; color: var(--text-muted); }

/* ─── Buzzer mode ─── */
.buzzer-box {
  background: var(--white);
  border-radius: var(--radius);
  padding: 2rem;
  text-align: center;
}
.buzzer-clue {
  font-size: 1.1rem;
  line-height: 1.7;
  color: var(--navy);
  min-height: 120px;
  text-align: left;
  margin-bottom: 1.5rem;
  font-weight: 500;
}
.buzzer-clue .revealed { color: var(--text); }
.buzzer-clue .hidden { color: transparent; user-select: none; }
.buzzer-clue .upcoming { color: var(--sand-dark); }

.timer-bar {
  height: 6px;
  background: var(--sand-dark);
  border-radius: 3px;
  margin-bottom: 1rem;
  overflow: hidden;
}
.timer-bar .fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s linear;
}
.timer-bar .fill.green { background: var(--green); }
.timer-bar .fill.gold { background: var(--gold); }
.timer-bar .fill.red { background: var(--red); }

.buzz-btn {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid var(--red);
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  box-shadow: 0 4px 15px rgba(192,57,43,0.3);
  transition: transform 0.1s, box-shadow 0.1s;
}
.buzz-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(192,57,43,0.4); }
.buzz-btn:active { transform: scale(0.95); }
.buzz-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

.answer-input {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
.answer-input input {
  flex: 1;
  padding: 0.7rem 1rem;
  border: 2px solid var(--sand-dark);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  outline: none;
}
.answer-input input:focus { border-color: var(--teal); }

.result-msg {
  margin-top: 1rem;
  padding: 0.8rem 1rem;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.95rem;
}
.result-msg.correct { background: var(--green-light); color: var(--green); }
.result-msg.wrong { background: var(--red-light); color: var(--red); }

.difficulty-select {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

/* ─── Progress dots ─── */
.progress-dots {
  display: flex;
  gap: 0.35rem;
  justify-content: center;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.progress-dots .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--sand-dark);
}
.progress-dots .dot.correct { background: var(--green); }
.progress-dots .dot.wrong { background: var(--red); }
.progress-dots .dot.current { background: var(--gold); box-shadow: 0 0 0 3px rgba(232,168,56,0.3); }

/* ─── Further study section ─── */
.terms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.6rem;
}
.term-chip {
  background: var(--white);
  padding: 0.6rem 0.8rem;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s;
}
.term-chip:hover { border-color: var(--gold); }
.term-chip.expanded {
  grid-column: 1 / -1;
  border-color: var(--teal);
  background: var(--sand);
}
.term-chip .term-desc {
  margin-top: 0.5rem;
  font-size: 0.84rem;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.5;
}

.hidden { display: none !important; }

/* ─── Responsive ─── */
@media (max-width: 600px) {
  .main-content { padding: 1rem; }
  .region-grid { grid-template-columns: 1fr; }
  .tab-nav button { font-size: 0.75rem; padding: 0.7rem 0.6rem; }
  .buzzer-box { padding: 1.2rem; }
  .buzz-btn { width: 90px; height: 90px; font-size: 0.85rem; }
}
</style>
</head>

</nav>

<main class="main-content" id="mainContent"></main>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initSimpleQuiz() {
  state.simpleQuestions = shuffle(SIMPLE_QUESTIONS);
  state.simpleIdx = 0;
  state.simpleAnswered = null;
  state.simpleScore = 0;
  state.simpleTotal = 0;
  state.simpleHistory = [];
}

function initComplexQuiz() {
  state.complexQuestions = shuffle(COMPLEX_QUESTIONS);
  state.complexIdx = 0;
  state.complexRevealed = false;
  state.complexScore = 0;
  state.complexTotal = 0;
  state.complexHistory = [];
}

function initBuzzerRound() {
  state.buzzerQuestions = shuffle(BUZZER_QUESTIONS);
  state.buzzerIdx = 0;
  state.buzzerClueIdx = 0;
  state.buzzerPhase = 'waiting';
  state.buzzerTimeLeft = 100;
  state.buzzerScore = 0;
  state.buzzerTotal = 0;
  state.buzzerHistory = [];
  clearInterval(state.buzzerTimer);
}

// Initialize
initSimpleQuiz();
initComplexQuiz();
initBuzzerRound();

// ─── Tab switching ───
document.getElementById('tabNav').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  const tab = e.target.dataset.tab;
  state.tab = tab;
  document.querySelectorAll('.tab-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
});

function render() {
  const main = document.getElementById('mainContent');
  switch (state.tab) {
    case 'learn': main.innerHTML = renderLearn(); break;
    case 'simple': main.innerHTML = renderSimple(); break;
    case 'complex': main.innerHTML = renderComplex(); break;
    case 'buzzer': main.innerHTML = renderBuzzer(); break;
  }
  attachHandlers();
}

function renderLearn() {
  let html = `<h2 class="section-title">Study Topics</h2>
    <p class="section-subtitle">Pick a region to explore. Each topic has key facts, memory tricks, and context to help you retain information for the bee.</p>`;
  
  html += `<div class="region-grid">`;
  for (const r of REGIONS) {
    html += `<div class="region-card ${state.selectedRegion === r.id ? 'active' : ''}" data-region="${r.id}">
      <span class="emoji">${r.emoji}</span>
      <h3>${r.name}</h3>
      <p>${r.desc}</p>
    </div>`;
  }
  html += `</div>`;

  if (state.selectedRegion) {
    const region = REGIONS.find(r => r.id === state.selectedRegion);
    if (region.id === 'terms') {
      html += renderTermsSection(region);
    } else {
      for (const topic of region.topics) {
        html += renderTopicCard(topic);
      }
    }
  }
  return html;
}

function renderTermsSection(region) {
  let html = `<div class="topic-detail"><h2>${region.emoji} Key Geographic Terms</h2>`;
  for (const topic of region.topics) {
    const isExpanded = state.expandedTerm === topic.title;
    html += `<div class="term-chip ${isExpanded ? 'expanded' : ''}" data-term="${topic.title}">
      <strong>${topic.title}</strong>`;
    if (isExpanded) {
      html += `<div class="term-desc">`;
      for (const f of topic.facts) {
        html += `<strong>${f.label}:</strong> ${f.text}<br><br>`;
      }
      if (topic.tags) html += `<div class="tag-row">${topic.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderTopicCard(topic) {
  let html = `<div class="topic-detail">
    <h2>${topic.title}</h2>`;
  
  if (topic.mapQuery) {
    html += `<iframe class="map-embed" src="https://www.openstreetmap.org/export/embed.html?bbox=${getOSMBbox(topic.mapQuery)}&layer=mapnik" loading="lazy"></iframe>
    <p class="img-credit">Map: OpenStreetMap contributors</p>`;
  }

  for (const f of topic.facts) {
    html += `<div class="fact-card">
      <h4>${f.label}</h4>
      <p>${f.text}</p>
      ${f.extra ? `<p style="margin-top:0.4rem;color:var(--text-muted);font-size:0.88rem;">${f.extra}</p>` : ''}
    </div>`;
  }

  if (topic.mnemonic) {
    html += `<div class="fact-card"><div class="mnemonic">${topic.mnemonic}</div></div>`;
  }

  if (topic.tags) {
    html += `<div class="tag-row">${topic.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
  }

  html += `</div>`;
  return html;
}

// ══════════════════════════════════════════
//  RENDER: Simple Quiz

function renderSimple() {
  const qs = state.simpleQuestions;
  if (!qs.length) { initSimpleQuiz(); return renderSimple(); }

  if (state.simpleIdx >= qs.length) {
    return renderQuizComplete('simple');
  }

  const q = qs[state.simpleIdx];
  const answered = state.simpleAnswered;

  let html = `<h2 class="section-title">Quick-Fire Quiz</h2>
    <p class="section-subtitle">Multiple choice — test your recall on the Red Set topics.</p>`;

  html += renderProgressDots(state.simpleHistory, state.simpleIdx, qs.length);
  html += renderScoreBar(state.simpleScore, state.simpleTotal);

  html += `<div class="question-box">
    <div class="q-number">Question ${state.simpleIdx + 1} of ${qs.length}</div>
    <div class="q-text">${q.q}</div>
    <ul class="options-list">`;

  q.opts.forEach((opt, i) => {
    let cls = '';
    if (answered !== null) {
      cls = 'disabled';
      if (i === q.ans) cls += ' correct answer-reveal';
      else if (i === answered && i !== q.ans) cls += ' wrong';
    }
    html += `<li class="${cls}" data-opt="${i}">${opt}</li>`;
  });

  html += `</ul>`;
  if (answered !== null) {
    html += `<div class="explanation">${q.explain}</div>
      <div style="margin-top:1rem;text-align:right;">
        <button class="btn btn-primary" data-action="simple-next">${state.simpleIdx < qs.length - 1 ? 'Next Question →' : 'See Results'}</button>
      </div>`;
  }
  html += `</div>`;
  return html;
}

//  RENDER: Complex Quiz
// ══════════════════════════════════════════

function renderComplex() {
  const qs = state.complexQuestions;
  if (!qs.length) { initComplexQuiz(); return renderComplex(); }

  if (state.complexIdx >= qs.length) {
    return renderQuizComplete('complex');
  }

  const q = qs[state.complexIdx];

  let html = `<h2 class="section-title">Bee-Style Questions</h2>
    <p class="section-subtitle">Multi-clue paragraph questions, just like the real tournament. Read carefully — the answer often hides in the details.</p>`;

  html += renderProgressDots(state.complexHistory, state.complexIdx, qs.length);
  html += renderScoreBar(state.complexScore, state.complexTotal);

  html += `<div class="question-box">
    <div class="q-number">Question ${state.complexIdx + 1} of ${qs.length}</div>
    <div class="q-text">${q.q}</div>`;

  if (!state.complexRevealed) {
    html += `<div style="margin-top:0.5rem;margin-bottom:1rem;">
      <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:0.6rem;">Clues to watch for:</p>
      <div class="tag-row">${q.hints.map(h => `<span class="tag">${h}</span>`).join('')}</div>
    </div>`;
    html += `<div class="answer-input">
      <input type="text" id="complexAnswer" placeholder="Type your answer..." autocomplete="off" />
      <button class="btn btn-gold" data-action="complex-submit">Submit</button>
    </div>
    <div style="margin-top:0.5rem;text-align:center;">
      <button class="btn btn-outline" data-action="complex-reveal" style="font-size:0.8rem;">Show Answer</button>
    </div>`;
  } else {
    const lastResult = state.complexHistory[state.complexHistory.length - 1];
    if (lastResult !== undefined) {
      html += `<div class="result-msg ${lastResult ? 'correct' : 'wrong'}">${lastResult ? '✓ Correct!' : '✗ Not quite.'} The answer is: <strong>${q.answer}</strong></div>`;
    } else {
      html += `<div class="result-msg wrong">The answer is: <strong>${q.answer}</strong></div>`;
    }
    html += `<div style="margin-top:1rem;text-align:right;">
      <button class="btn btn-primary" data-action="complex-next">${state.complexIdx < qs.length - 1 ? 'Next Question →' : 'See Results'}</button>
    </div>`;
  }

  html += `</div>`;
  return html;
}

// ══════════════════════════════════════════
//  RENDER: Buzzer Mode
// ══════════════════════════════════════════

function renderBuzzer() {
  const qs = state.buzzerQuestions;
  if (!qs.length) { initBuzzerRound(); return renderBuzzer(); }

  if (state.buzzerIdx >= qs.length) {
    return renderQuizComplete('buzzer');
  }

  const q = qs[state.buzzerIdx];

  let html = `<h2 class="section-title">Buzzer Round</h2>
    <p class="section-subtitle">Clues reveal one at a time. Buzz in early for bonus points — but be careful, a wrong answer costs you! Earlier buzz = more points.</p>`;

  html += renderProgressDots(state.buzzerHistory, state.buzzerIdx, qs.length);
  html += renderScoreBar(state.buzzerScore, state.buzzerTotal);

  html += `<div class="buzzer-box">`;

  // Timer bar
  const pct = state.buzzerTimeLeft;
  const timerColor = pct > 60 ? 'green' : pct > 30 ? 'gold' : 'red';
  html += `<div class="timer-bar"><div class="fill ${timerColor}" style="width:${pct}%"></div></div>`;

  // Clue display
  html += `<div class="buzzer-clue">`;
  if (state.buzzerPhase === 'waiting') {
    html += `<p style="text-align:center;color:var(--text-muted);">Press Start to begin the next question.</p>`;
  } else {
    for (let i = 0; i < q.clues.length; i++) {
      if (i <= state.buzzerClueIdx) {
        html += `<p class="revealed" style="margin-bottom:0.6rem;">${q.clues[i]}</p>`;
      }
    }
  }
  html += `</div>`;

  // Controls
  if (state.buzzerPhase === 'waiting') {
    html += `<button class="btn btn-gold" data-action="buzzer-start" style="font-size:1rem;padding:0.8rem 2rem;">Start Question</button>`;
  } else if (state.buzzerPhase === 'revealing') {
    html += `<button class="buzz-btn" data-action="buzzer-buzz">BUZZ!</button>
      <p style="margin-top:0.8rem;font-size:0.8rem;color:var(--text-muted);">Press Space or click to buzz in</p>`;
  } else if (state.buzzerPhase === 'buzzed') {
    html += `<div class="answer-input">
      <input type="text" id="buzzerAnswer" placeholder="Your answer..." autocomplete="off" autofocus />
      <button class="btn btn-gold" data-action="buzzer-submit">Submit</button>
    </div>
    <p style="margin-top:0.5rem;font-size:0.8rem;color:var(--text-muted);">You buzzed at clue ${state.buzzerClueIdx + 1} of ${q.clues.length}</p>`;
  } else if (state.buzzerPhase === 'answered') {
    const lastResult = state.buzzerHistory[state.buzzerHistory.length - 1];
    const points = lastResult ? (q.clues.length - state.buzzerClueIdx) * 2 : 0;
    html += `<div class="result-msg ${lastResult ? 'correct' : 'wrong'}">
      ${lastResult ? `✓ Correct! +${points} points (buzzed at clue ${state.buzzerClueIdx + 1})` : `✗ Wrong. The answer is: ${q.answer}`}
    </div>`;
    // Show remaining clues
    if (!lastResult) {
      html += `<div style="margin-top:1rem;text-align:left;font-size:0.85rem;color:var(--text-muted);">`;
      for (let i = 0; i < q.clues.length; i++) {
        html += `<p style="margin-bottom:0.4rem;">${q.clues[i]}</p>`;
      }
      html += `</div>`;
    }
    html += `<div style="margin-top:1rem;">
      <button class="btn btn-primary" data-action="buzzer-next">${state.buzzerIdx < qs.length - 1 ? 'Next Question →' : 'See Results'}</button>
    </div>`;
  } else if (state.buzzerPhase === 'done') {
    html += `<div class="result-msg wrong">Time's up! The answer was: <strong>${q.answer}</strong></div>`;
    html += `<div style="margin-top:1rem;text-align:left;font-size:0.85rem;color:var(--text-muted);">`;
    for (const c of q.clues) html += `<p style="margin-bottom:0.4rem;">${c}</p>`;
    html += `</div>`;
    html += `<div style="margin-top:1rem;">
      <button class="btn btn-primary" data-action="buzzer-next">${state.buzzerIdx < qs.length - 1 ? 'Next Question →' : 'See Results'}</button>
    </div>`;
  }

  html += `</div>`;
  return html;
}

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════

function renderProgressDots(history, currentIdx, total) {
  let html = `<div class="progress-dots">`;
  for (let i = 0; i < total; i++) {
    let cls = 'dot';
    if (i < history.length) cls += history[i] ? ' correct' : ' wrong';
    else if (i === currentIdx) cls += ' current';
    html += `<div class="${cls}"></div>`;
  }
  html += `</div>`;
  return html;
}

function renderScoreBar(score, total) {
  return `<div class="score-bar">
    <span class="score-text">Score: ${score}</span>
    <span class="score-detail">${total} answered</span>
  </div>`;
}

function renderQuizComplete(type) {
  let score, total, label;
  if (type === 'simple') { score = state.simpleScore; total = state.simpleTotal; label = 'Quick-Fire Quiz'; }
  else if (type === 'complex') { score = state.complexScore; total = state.complexTotal; label = 'Bee-Style Questions'; }
  else { score = state.buzzerScore; total = state.buzzerTotal; label = 'Buzzer Round'; }

  const pct = total > 0 ? Math.round(score / (type === 'buzzer' ? total * 10 : total) * 100) : 0;
  let msg = pct >= 80 ? "Outstanding! You're ready for the semifinals." : pct >= 60 ? "Good work! Review the topics you missed." : "Keep studying — you'll get there!";

  return `<div class="buzzer-box" style="text-align:center;padding:2.5rem;">
    <h2 style="font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--navy);margin-bottom:0.5rem;">${label} Complete</h2>
    <p style="font-size:2.5rem;font-weight:700;color:var(--gold);margin:1rem 0;">${score} ${type === 'buzzer' ? 'points' : `/ ${total}`}</p>
    <p style="color:var(--text-muted);margin-bottom:1.5rem;">${msg}</p>
    <button class="btn btn-gold" data-action="restart-${type}">Try Again (New Order)</button>
  </div>`;
}

// ══════════════════════════════════════════
//  EVENT HANDLERS
// ══════════════════════════════════════════

function attachHandlers() {
  // Region selection
  document.querySelectorAll('.region-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.region;
      state.selectedRegion = state.selectedRegion === id ? null : id;
      state.expandedTerm = null;
      render();
    });
  });

  // Term expansion
  document.querySelectorAll('.term-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const term = chip.dataset.term;
      state.expandedTerm = state.expandedTerm === term ? null : term;
      render();
    });
  });

  // Simple quiz options
  document.querySelectorAll('.options-list li:not(.disabled)').forEach(li => {
    li.addEventListener('click', () => {
      if (state.simpleAnswered !== null) return;
      const idx = parseInt(li.dataset.opt);
      state.simpleAnswered = idx;
      const q = state.simpleQuestions[state.simpleIdx];
      const correct = idx === q.ans;
      if (correct) state.simpleScore++;
      state.simpleTotal++;
      state.simpleHistory.push(correct);
      render();
    });
  });

  // Simple next
  document.querySelector('[data-action="simple-next"]')?.addEventListener('click', () => {
    state.simpleIdx++;
    state.simpleAnswered = null;
    render();
  });

  // Complex submit
  document.querySelector('[data-action="complex-submit"]')?.addEventListener('click', submitComplexAnswer);
  document.getElementById('complexAnswer')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitComplexAnswer();
  });

  // Complex reveal
  document.querySelector('[data-action="complex-reveal"]')?.addEventListener('click', () => {
    state.complexRevealed = true;
    state.complexTotal++;
    state.complexHistory.push(false);
    render();
  });

  // Complex next
  document.querySelector('[data-action="complex-next"]')?.addEventListener('click', () => {
    state.complexIdx++;
    state.complexRevealed = false;
    render();
  });

  // Buzzer controls
  document.querySelector('[data-action="buzzer-start"]')?.addEventListener('click', startBuzzerQuestion);
  document.querySelector('[data-action="buzzer-buzz"]')?.addEventListener('click', buzzIn);
  document.querySelector('[data-action="buzzer-submit"]')?.addEventListener('click', submitBuzzerAnswer);
  document.getElementById('buzzerAnswer')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitBuzzerAnswer();
  });
  document.querySelector('[data-action="buzzer-next"]')?.addEventListener('click', () => {
    state.buzzerIdx++;
    state.buzzerClueIdx = 0;
    state.buzzerPhase = 'waiting';
    state.buzzerTimeLeft = 100;
    clearInterval(state.buzzerTimer);
    render();
  });

  // Restart buttons
  document.querySelector('[data-action="restart-simple"]')?.addEventListener('click', () => { initSimpleQuiz(); render(); });
  document.querySelector('[data-action="restart-complex"]')?.addEventListener('click', () => { initComplexQuiz(); render(); });
  document.querySelector('[data-action="restart-buzzer"]')?.addEventListener('click', () => { initBuzzerRound(); render(); });

  // Focus answer input
  setTimeout(() => {
    document.getElementById('buzzerAnswer')?.focus();
    document.getElementById('complexAnswer')?.focus();
  }, 50);
}

function submitComplexAnswer() {
  const input = document.getElementById('complexAnswer');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  const q = state.complexQuestions[state.complexIdx];
  const correct = checkAnswer(val, q.answer);
  state.complexRevealed = true;
  state.complexTotal++;
  if (correct) state.complexScore++;
  state.complexHistory.push(correct);
  render();
}

function startBuzzerQuestion() {
  state.buzzerPhase = 'revealing';
  state.buzzerClueIdx = 0;
  state.buzzerTimeLeft = 100;
  clearInterval(state.buzzerTimer);

  const q = state.buzzerQuestions[state.buzzerIdx];
  const totalClues = q.clues.length;
  const msPerClue = 4000;
  let elapsed = 0;
  const totalTime = totalClues * msPerClue;

  render();

  state.buzzerTimer = setInterval(() => {
    elapsed += 100;
    state.buzzerTimeLeft = Math.max(0, 100 - (elapsed / totalTime) * 100);

    const newClueIdx = Math.min(Math.floor(elapsed / msPerClue), totalClues - 1);
    if (newClueIdx !== state.buzzerClueIdx) {
      state.buzzerClueIdx = newClueIdx;
      render();
    }

    // Update timer bar without full re-render
    const fill = document.querySelector('.timer-bar .fill');
    if (fill) {
      fill.style.width = state.buzzerTimeLeft + '%';
      fill.className = 'fill ' + (state.buzzerTimeLeft > 60 ? 'green' : state.buzzerTimeLeft > 30 ? 'gold' : 'red');
    }

    if (elapsed >= totalTime + 3000) {
      clearInterval(state.buzzerTimer);
      state.buzzerPhase = 'done';
      state.buzzerTotal++;
      state.buzzerHistory.push(false);
      render();
    }
  }, 100);
}

function buzzIn() {
  if (state.buzzerPhase !== 'revealing') return;
  clearInterval(state.buzzerTimer);
  state.buzzerPhase = 'buzzed';
  render();
}

function submitBuzzerAnswer() {
  const input = document.getElementById('buzzerAnswer');
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  const q = state.buzzerQuestions[state.buzzerIdx];
  const correct = checkAnswer(val, q.answer);
  state.buzzerPhase = 'answered';
  state.buzzerTotal++;
  if (correct) {
    const points = (q.clues.length - state.buzzerClueIdx) * 2;
    state.buzzerScore += points;
  }
  state.buzzerHistory.push(correct);
  render();
}

function checkAnswer(userInput, correctAnswer) {
  const normalize = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  const u = normalize(userInput);
  const c = normalize(correctAnswer);
  
  // Exact match
  if (u === c) return true;
  
  // One contains the other
  if (c.includes(u) && u.length > 3) return true;
  if (u.includes(c)) return true;
  
  // Remove common prefixes like "the", "mount", "lake", "river", "strait of"
  const strip = s => s.replace(/^(the |mount |lake |river |strait of |strait |gulf of )/i, '');
  if (strip(u) === strip(c)) return true;
  
  // Check individual important words
  const cWords = c.split(' ').filter(w => w.length > 2);
  const uWords = u.split(' ').filter(w => w.length > 2);
  const matchCount = cWords.filter(w => uWords.includes(w)).length;
  if (matchCount >= Math.ceil(cWords.length * 0.6) && matchCount >= 1) return true;

  return false;
}

// Keyboard shortcut for buzzer
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && state.tab === 'buzzer' && state.buzzerPhase === 'revealing') {
    e.preventDefault();
    buzzIn();
  }
});

// Initial render
render();
</script>
</body>
</html>
